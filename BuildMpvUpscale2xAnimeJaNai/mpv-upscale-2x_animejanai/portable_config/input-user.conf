# Section personnelle : conservee par les mises a jour AnimeJaNai.

# 1. Rendu AnimeJaNai : meme commande sur NVIDIA / AMD / Intel.
# La selection conserve le filtre existant et la banque adaptee au GPU.
Ctrl+0      script-message-to hardware_auto animejanai-select 0
Ctrl+1      script-message-to hardware_auto animejanai-select 1
Ctrl+2      script-message-to hardware_auto animejanai-select 2
Ctrl+3      script-message-to hardware_auto animejanai-select 3
Ctrl+4      script-message-to hardware_auto animejanai-select 4
# 0 = desactive ; 1/2/3/4 = profils 1080p/4K/2K/variante de la banque du GPU (vide = refuse).
# NVIDIA conserve RIFE configure dans les profils ; AMD : aucun RIFE par defaut.
# AMD AMF x2 s'applique a tous les profils via le Manager (Extra Frame Generation).

# 2. Image : une seule bascule, sans effacer les shaders HDR.
b           cycle deband; show-text "Debanding : ${deband}" 3000

# 3. Diagnostic unique : source, sortie, ecran, GPU, HDR, VSR, grading, AI et images perdues.
Ctrl+Alt+h  script-message-to animejanai_hdr_auto animejanai-hdr-status
# Grading HDR : reglages du Manager -> look Natural -> sans grading (comparaison A/B).
Ctrl+g      script-message-to animejanai_hdr_auto animejanai-grade-toggle
# Mire d'etalonnage HDR (noirs, rampe, gris, pics) ; meme touche pour la retirer.
Ctrl+Alt+p  script-message-to animejanai_hdr_auto animejanai-calibration #menu: AnimeJaNai > HDR Calibration Pattern
# Manager avec les reglages Mise a l'echelle / HDR (Global Settings). L'original reste dans le menu.
Ctrl+e      nonrepeatable script-message-to hardware_auto animejanai-manager #menu: AnimeJaNai > Launch AnimeJaNai Manager (HDR)
# La console (`), les informations de fichier (i) et le Manager (Ctrl+e)
# restent accessibles par leurs commandes habituelles.

# 4. Anciens raccourcis redondants ou profils vides : desactives.
# Overrides du bloc gere, plutot que de modifier les fichiers de l'Updater.
Ctrl+b      ignore
Ctrl+j      ignore
t           ignore
Ctrl+5      ignore
Ctrl+6      ignore
Ctrl+7      ignore
Ctrl+8      ignore
# Profil 9 : le profil Performance des installations neuves (profil de demarrage).
Ctrl+9      script-message-to hardware_auto animejanai-select 9
)           ignore
!           ignore
@           ignore
SHARP       ignore
