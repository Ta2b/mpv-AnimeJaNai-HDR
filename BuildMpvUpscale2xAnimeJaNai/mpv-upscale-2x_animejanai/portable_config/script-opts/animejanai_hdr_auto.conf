# Reglages aussi modifiables dans AnimeJaNai Manager (HDR) > Global Settings (Ctrl+E).
# ===== Materiel =====
# GPU : auto detecte la carte ; nvidia / amd / intel pour forcer.
gpu_vendor=auto
# Resolution finale apres AnimeJaNai : auto = ecran ou se trouve MPV, ou par ex. 2560x1440.
target_resolution=auto
# Mise a l'echelle finale : auto = RTX VSR sur NVIDIA, AMD VideoSR sur AMD, D3D11 ailleurs.
# no = aucune ; classic = D3D11 sur tous les GPU.
vsr=auto
# Conversion SDR -> HDR : no = les videos SDR restent SDR et le HDR Windows n'est jamais modifie.
hdr_conversion=yes
# Moteur de conversion : auto = RTX TrueHDR sur NVIDIA, MPV sur AMD/Intel ; rtx / mpv pour forcer.
hdr_backend=auto
# HDR Windows : enable = MPV l'active puis le restaure ; follow = suivre l'etat de Windows.
# mode = NVIDIA ; amd_mode = AMD/Intel.
mode=follow
amd_mode=enable
idle_restore_seconds=2
max_attempts=3

# ===== Ecran, par GPU =====
# *_nvidia = PC NVIDIA (MSI MAG 272UP QD-OLED, Peak 1000 / EOTF Boost).
# *_amd    = PC AMD/Intel (ecran a decrire ; auto = valeurs annoncees par Windows).
# peak  : pic en nits ou auto. Faire aussi l'etalonnage HDR Windows a cette valeur.
# gamut : display-p3 / bt.2020 / auto. oled : yes = noir parfait (contraste infini).
peak_nvidia=1000
gamut_nvidia=display-p3
oled_nvidia=yes
peak_amd=auto
gamut_amd=display-p3
oled_amd=auto

# ===== Rendu HDR (shader anime-hdr-grade, commun a tous les GPU) =====
# grade=no : sortie HDR neutre. Ctrl+G compare avec / sans pendant la lecture.
grade=yes
# Blanc SDR en nits quand MPV convertit (AMD/Intel ou hdr_backend=mpv). 203 = reference BT.2408.
paper_white=203
# Noirs plus profonds : 0 = neutre, 0.8 = maximum. Seuls les tons sous ~50 nits sont touches.
shadows=0.30
# Eclats lumineux : 0 = aucun, 1 = les eclats isoles atteignent le pic.
# highlights = SDR converti par MPV ; highlights_rtx = renfort par-dessus RTX TrueHDR.
highlights=0.85
highlights_rtx=0.50
# Vibrance perceptuelle : 0 = neutre, 0.8 = maximum. Peau et couleurs deja saturees menagees.
vibrance=0.30
vibrance_rtx=0.20
# Appliquer aussi le grading aux sources deja HDR (respect de l'etalonnage d'origine sinon).
grade_native_hdr=no

# Journaux de diagnostic ; Ctrl+Alt+H reste disponible dans tous les cas.
diagnostic=yes
