# Reglages aussi modifiables dans AnimeJaNai Manager (HDR) > Global Settings (Ctrl+E).
# ===== Materiel =====
# GPU : auto detecte la carte ; nvidia / amd / intel pour forcer.
gpu_vendor=auto
# Resolution finale apres AnimeJaNai : auto = ecran ou se trouve MPV, ou par ex. 2560x1440.
target_resolution=auto
# Mise a l'echelle finale : auto = RTX VSR sur NVIDIA, AMD VideoSR sur AMD, D3D11 ailleurs.
# no = aucune ; classic = D3D11 sur tous les GPU.
vsr=auto
# Generation d'images en plus de RIFE : off / amf (AMD AMF x2 dans le lecteur, AMD uniquement).
# Windows : NVIDIA Smooth Motion et AMD Fluid Motion Frames se reglent dans le pilote, pas ici.
frame_generation=off
# Linux, NVIDIA : Smooth Motion du pilote (images generees a l affichage, sur toute la fenetre,
# sous-titres compris). Lu au lancement du lecteur : le redemarrer apres un changement.
smooth_motion=no
# RIFE cale sur l'ecran : facteur choisi pour que chaque image reste affichee le meme temps
# (ex. 23,976 i/s sur 144 Hz -> x2 = 48 i/s, 3 rafraichissements par image). no = facteur du profil.
# Ignore quand AnimeJaNai gere lui-meme le rafraichissement (display_rate_match=yes).
rife_display_sync=no
# Facteur maximal autorise (2 = au plus le double des images).
rife_max_factor=2
# Above 100 frames per second: spline36 for the last enlargement to the screen.
rife_light_scale=yes
# Conversion SDR -> HDR : no = les videos SDR restent SDR et le HDR Windows n'est jamais modifie.
hdr_conversion=yes
# Moteur de conversion : auto = RTX TrueHDR sur NVIDIA, MPV sur AMD/Intel ; rtx / mpv pour forcer.
hdr_backend=auto
# HDR Windows : follow suit l'etat du systeme ; enable active HDR pendant la lecture.
windows_hdr=follow
idle_restore_seconds=2
max_attempts=3

# ===== Ecran (commun a tous les GPU) =====
# auto suit les informations du systeme et du rendu MPV, sans imposer de moniteur.
display_peak=auto
display_gamut=auto
# Aucun type de dalle n'est presume. yes uniquement si l'ecran OLED est confirme.
display_oled=no

# ===== Rendu HDR (shader anime-hdr-grade, commun a tous les GPU) =====
# grade=yes : rendu Natural par defaut ; grade=no : sortie HDR neutre. Ctrl+G compare avec / sans pendant la lecture.
grade=yes
# Blanc SDR en nits quand MPV convertit (AMD/Intel ou hdr_backend=mpv). 203 = reference BT.2408.
paper_white=203
# Noirs plus profonds : 0 = neutre, 0.8 = maximum. Seuls les tons sous ~50 nits sont touches.
shadows=0.15
# Eclats lumineux : 0 = aucun, 1 = les eclats isoles atteignent le pic.
# highlights = SDR converti par MPV ; highlights_rtx = renfort par-dessus RTX TrueHDR.
highlights=0.50
highlights_rtx=0.25
# Vibrance perceptuelle : 0 = neutre, 0.8 = maximum. Peau et couleurs deja saturees menagees.
vibrance=0.15
vibrance_rtx=0.10
# Appliquer aussi le grading aux sources deja HDR (respect de l'etalonnage d'origine sinon).
grade_native_hdr=no
# Blanc des sous-titres en nits sur une sortie HDR (80 a 1000). 200 = un peu sous le blanc video.
subtitle_white=200

# Journaux de diagnostic ; Ctrl+Alt+H reste disponible dans tous les cas.
diagnostic=no

# ===== Sortie Vulkan (NVIDIA) =====
# render_api=vulkan : rendu Vulkan ; RTX Video (VSR + TrueHDR) tourne dans le moteur AnimeJaNai,
# en CUDA, sans passer par D3D11. Requis pour NVIDIA Smooth Motion. Demande aji_rtx.dll dans
# animejanai/inference. d3d11 = comportement habituel. A changer lecteur ferme.
render_api=d3d11
# Qualite de RTX VSR dans le moteur : 1 (rapide) a 4 (meilleure, environ 11 ms par image en 4K).
rtx_vsr_quality=2
# TrueHDR dans le moteur : contraste et saturation 0-200 (100 = neutre), gris moyen 10-100.
# Ces valeurs remplacent ici les curseurs RTX Video HDR de l application NVIDIA.
# Un seul aspect HDR pour tous les GPU : ces trois reglages pilotent RTX Video HDR (sortie Vulkan)
# ET la conversion MPV quand mpv_truehdr_look=yes (AMD, Intel, hdr_backend=mpv, aucune chaine).
# En Direct3D 11, RTX Video HDR suit les curseurs de l application NVIDIA : y mettre les memes valeurs.
rtx_contrast=100
rtx_saturation=100
rtx_middle_gray=50
# Dessins tenus (sortie Vulkan) : une image identique a la derniere image traitee reprend son
# resultat au lieu de repasser dans RIFE, le modele, VSR et TrueHDR. Un anime repete chaque dessin
# sur 2 ou 3 images : la charge moyenne du GPU baisse sans changer l image. no = tout recalculer.
skip_held_frames=yes
# Ecart maximal tolere par bloc de 32x32 pixels, en niveaux sur 255. Plus bas = plus strict.
# Le bruit de compression deplace a lui seul le pire bloc d un dessin tenu de 0,4 a 0,7 niveau :
# en dessous de 0,70 la plupart des dessins tenus sont recalcules pour rien. Au-dela de 0,70,
# un tres petit mouvement (quelques pixels) peut etre pris pour un dessin tenu.
held_threshold=0.70

# ===== Aspect RTX TrueHDR pour la conversion MPV =====
# yes : quand MPV convertit le SDR en HDR (AMD/Intel, hdr_backend=mpv, ou aucune chaine active),
# le shader applique la courbe mesuree sur RTX TrueHDR : blanc SDR au pic de l ecran, tons moyens
# vers 50 nits, puis le meme grading que sur TrueHDR (highlights_rtx, vibrance_rtx, shadows).
# no : conversion MPV d origine (blanc SDR a paper_white, eclats par zone).
mpv_truehdr_look=yes

# Linux : auto suit les preferences du compositeur ; sdr force SDR ; pq demande HDR.
# Le grading exige une sortie PQ negociee, jamais les metadonnees de la source.
linux_hdr_output=auto
