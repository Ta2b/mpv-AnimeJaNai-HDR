# Linux AMD starter profiles (Vulkan). Ctrl+1 to Ctrl+6 select them, Ctrl+0 turns processing off.
[global]
config_version=3
backend=Vulkan
backend_auto_fallback=no
logging=no
default_slot=1
[slot_1]
profile_name=Performance · 360p → 720p
chain_1_min_resolution=0x0
chain_1_max_resolution=1920x1080
chain_1_min_fps=0
chain_1_max_fps=61
chain_1_model_1_resize_height_before_upscale=360
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1_Performance_SPANF3_b5f48_unshuffle_fp16
chain_1_rife=no
chain_1_rife_model=46
chain_1_rife_factor_numerator=2
chain_1_rife_factor_denominator=1
chain_1_rife_before_upscale=yes
chain_1_rife_scd_threshold=0.2
[slot_2]
profile_name=Performance · 360p → 720p + RIFE ×2
chain_1_min_resolution=0x0
chain_1_max_resolution=1920x1080
chain_1_min_fps=0
chain_1_max_fps=61
chain_1_model_1_resize_height_before_upscale=360
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16
chain_1_rife=yes
chain_1_rife_model=46
