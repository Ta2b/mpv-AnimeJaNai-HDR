# Linux NVIDIA starter profiles (TensorRT). Ctrl+1 to Ctrl+5 select them, Ctrl+0 turns processing off.
# The RIFE profiles interpolate sources up to 31 fps; faster sources are upscaled only.
# The chain_K_rife*/chain_K_model_M_* keys are regenerated from the stages (profile contract v2).

[global]
config_version=4
backend=TensorRT
backend_auto_fallback=no
logging=no
rife_engine=quality
rife_drawings=yes
default_slot=1
[slot_1]
profile_name=Balanced · 1080p → 2160p
chain_1_min_resolution=0x0
chain_1_max_resolution=1920x1080
chain_1_min_fps=0
chain_1_max_fps=61
chain_1_pipeline_version=1
chain_1_stage_count=1
chain_1_stage_1_id=upscale
chain_1_stage_1_kind=upscale
chain_1_stage_1_method=onnx
chain_1_stage_1_runtime=tensorrt
chain_1_stage_1_enabled=yes
chain_1_stage_1_model=2x_AnimeJaNai_HD_V3.1Sharp1_Balanced_SPANF3_b8f64_unshuffle_fp16
chain_1_stage_1_factor_numerator=1
chain_1_stage_1_factor_denominator=1
chain_1_stage_1_policy=quality
chain_1_rife=no
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Balanced_SPANF3_b8f64_unshuffle_fp16
