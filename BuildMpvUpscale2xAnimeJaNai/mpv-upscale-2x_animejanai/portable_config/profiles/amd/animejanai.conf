# Banque AMD/Intel : equivalents des profils NVIDIA, sans RIFE.
# Le profil 4 ajoute AMF x2 via Lua, sur AMD uniquement.
[global]
config_version=3
backend=DirectML
backend_auto_fallback=no
logging=yes
default_slot=3
