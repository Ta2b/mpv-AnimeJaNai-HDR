# AnimeJaNai + HDR - CONFIGURATION UTILISATEUR (preservee par les mises a jour).
# PC NVIDIA : MSI MAG 272UP QD-OLED, 3840x2160, jusqu'a 165 Hz, 10 bits, Peak 1000 / EOTF Boost.
# Le meme dossier fonctionne sur un PC AMD : les reglages propres a chaque GPU et a
# chaque ecran sont dans script-opts/animejanai_hdr_auto.conf (*_nvidia / *_amd).
# NE PAS modifier mpv-animejanai.conf (remplace a chaque mise a jour).
include="~~/mpv-animejanai.conf"
profile=animejanai

# Scripts personnels hors du dossier remplace par l'Updater.
# Le chargeur detecte le GPU, puis lance les scripts personnels et officiels.
load-scripts=no
script=~~/hdr-tools/user-script-loader.lua

alang=jpn,jp,eng,en,enUS,fr,fra
slang=fre,fr,fra,fr-FR,eng,en,enUS

# ===== Sortie video =====
# D3D11 est requis par RTX TrueHDR / RTX VSR (NVIDIA) et par DirectML (AMD).
# Sur AMD/Intel, hardware_auto.lua passe le decodage en d3d11va avant la lecture.
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=nvdec
d3d11-exclusive-fs=no
d3d11-output-mode=window
# Flip model indispensable au HDR.
d3d11-flip=yes
d3d11-output-csp=auto
d3d11-output-format=rgb10_a2
dither-depth=10

# ===== HDR =====
# Detection automatique de l'etat HDR de Windows. Quand le HDR est confirme,
# animejanai_hdr_auto.lua regle pic / contraste / gamut de l'ecran et le grading.
target-colorspace-hint=yes
target-colorspace-hint-mode=target
target-trc=auto
target-prim=auto
target-peak=auto
video-output-levels=auto
inverse-tone-mapping=no
hdr-reference-white=203
# Sous-titres en HDR : blanc a 200 nits, pas eblouissant.
sub-hdr-peak=200
image-subs-hdr-peak=200
# Uniquement pour les sources deja HDR (BD/WEB HDR10) plus lumineuses que l'ecran.
tone-mapping=bt.2390
gamut-mapping-mode=perceptual
hdr-peak-percentile=100
hdr-contrast-recovery=0

# ===== Image =====
# Debanding modere : protege les traits fins. Remplace le bruit et le grain fort du profil gere.
glsl-shaders=
deband=yes
deband-iterations=1
deband-threshold=24
deband-range=16
deband-grain=8
# Chroma YUV : reechantillonnage doux, halos colores limites (ignore si les filtres sortent du RGB).
cscale=ewa_lanczos
cscale-antiring=0.6

# Sous-titres composes a la resolution de l'ecran, apres le grading HDR.
blend-subtitles=no
# RIFE est gere par AnimeJaNai : pas de seconde interpolation dans MPV.
interpolation=no

input-ipc-server=mpvpipe
# Diagnostic ponctuel :
#log-file=~~/mpv-hdr.log

# ===== Profils manuels (--profile=... ou console : apply-profile ...) =====
# Debanding renforce pour les sources dont les aplats ont du banding.
[anime-deband-fort]
profile-restore=copy
deband-iterations=2
deband-threshold=48
deband-grain=16

# Cadence parfaite avec RIFE x2 (47,952 i/s) : regler Windows sur 144 Hz (= 3 x 48)
# puis lancer avec ce profil. A 165 Hz la cadence reste irreguliere (3,44 rafraichissements/image).
[anime-cadence-ecran]
profile-restore=copy
video-sync=display-resample
interpolation=no

# Chemin AMD/Intel : DirectML, jamais TensorRT. Applique par gpu-policy.lua.
[upscale-on-amd]
vf=@aji:animejanai:lib=~~/../animejanai/inference/aji.dll:conf=~~/../animejanai/animejanai.conf:model-dir=~~/../animejanai/onnx:rife-model-dir=~~/../animejanai/rife:trtexec=~~/../animejanai/inference/trtexec.exe:stats=~~/../animejanai/currentanimejanai.log:slot=3
