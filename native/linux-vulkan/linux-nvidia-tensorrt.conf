# Linux NVIDIA : inference opt-in (Ctrl+1). RIFE opt-in (Ctrl+2).
[global]
config_version=3
backend=TensorRT
backend_auto_fallback=no
logging=yes
default_slot=0
[slot_1]
profile_name=Linux Performance 720p
chain_1_min_resolution=640x360
chain_1_max_resolution=1920x1080
chain_1_min_fps=0
chain_1_max_fps=31
chain_1_model_1_resize_height_before_upscale=720
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16
chain_1_rife=no
chain_1_rife_model=426
chain_1_rife_factor_numerator=2
chain_1_rife_factor_denominator=1
chain_1_rife_before_upscale=yes
[slot_2]
profile_name=Linux Performance 720p RIFE x2
chain_1_min_resolution=640x360
chain_1_max_resolution=1920x1080
chain_1_min_fps=0
chain_1_max_fps=31
chain_1_model_1_resize_height_before_upscale=720
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16
chain_1_rife=yes
chain_1_rife_model=426
