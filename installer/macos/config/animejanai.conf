# macOS (Core ML) : Ctrl+1 à Ctrl+6. Les modèles doublent la taille de l'image.
# Les profils 5 et 6 sont ceux vers lesquels le lecteur descend seul quand le Mac ne suit pas
# (auto_profile dans animejanai_mac.conf).
# Pas d'interpolation RIFE avec ce moteur.
# Ce fichier est écrit par le Manager (Ctrl+E dans le lecteur). Section [global] :
#   backend             CoreML (Core ML par ONNX Runtime), CoreMLNative (Core ML seul) ou Metal
#   apple_device        AUTO, GPU, NPU (Neural Engine), CPU ou GPU+NPU
#   engine_reuse        off, frame (image identique reprise) ou tiles (zones inchangées reprises)
#   apple_auto_profile  yes : profil plus léger quand ce Mac ne suit pas la vidéo
#   engine_tiles        auto, 1, 2x2, 3x2... (découpe de l'image ; auto convient)
[global]
config_version=3
backend=CoreML
apple_device=AUTO
engine_reuse=frame
apple_auto_profile=yes
backend_auto_fallback=no
logging=no
default_slot=1
[slot_1]
profile_name=Performance, 1080p ramene a 720p puis x2
chain_1_min_resolution=0x0
chain_1_max_resolution=1280x720
chain_1_min_fps=0
chain_1_max_fps=61
chain_1_model_1_resize_height_before_upscale=0
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16
chain_1_rife=no
chain_2_min_resolution=1280x721
chain_2_max_resolution=1920x1080
chain_2_min_fps=0
chain_2_max_fps=61
chain_2_model_1_resize_height_before_upscale=720
chain_2_model_1_resize_factor_before_upscale=100
chain_2_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16
chain_2_rife=no
