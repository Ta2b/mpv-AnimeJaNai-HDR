# Profil appliqué à l'ouverture d'une vidéo (0 = désactivé, 1 à 6 = profils de animejanai.conf).
default_slot=1
# Unités de calcul Core ML : ALL (Core ML choisit), GPU, ANE (Neural Engine) ou CPU.
device=ALL
# device=GPU+ANE : l'image est coupee en deux bandes traitees en meme temps, une par processeur.
# yes : si le profil est plus lent que la vidéo sur ce Mac, le lecteur passe seul au profil plus
# léger suivant (1, puis 5, puis 6, puis désactivé) et s'en souvient. Ctrl+r : oublier et remesurer.
# Un profil choisi au clavier est gardé pour la séance.
auto_profile=yes
