# mpv AnimeJaNai HDR - macOS (aperçu). Réglages de l'application ; un mpv.conf personnel dans
# ~/.config/mpv s'applique par-dessus.
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
# L'écran reçoit le format de la vidéo (HDR natif sur un écran XDR).
target-colorspace-hint=yes
# Le moteur reçoit des images en mémoire : décodage matériel avec copie.
hwdec=videotoolbox-copy
keep-open=yes
osd-font-size=28
