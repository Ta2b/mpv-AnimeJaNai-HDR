# mpv AnimeJaNai HDR - macOS (aperçu). Ce fichier vous appartient : il n'est créé qu'une fois.
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
# L'écran reçoit le format de la vidéo (HDR natif sur un écran XDR).
target-colorspace-hint=yes
# Le moteur reçoit des images en mémoire : décodage matériel avec copie.
hwdec=videotoolbox-copy
keep-open=yes
osd-font-size=28
