name: Platform checks
on:
  push:
    branches: [hdr-3.8]
    paths:
      - 'AnimeJaNaiPlatform/**'
      - 'AnimeJaNaiUpdater/**'
      - 'BuildMpvUpscale2xAnimeJaNai/**'
      - 'installer/linux/**'
      - 'native/**'
      - 'tests/**'
      - 'tools/*linux*'
      - '.github/workflows/linux-port.yml'
      - 'manager-source-ref.txt'
  pull_request:
    paths:
      - 'AnimeJaNaiPlatform/**'
      - 'AnimeJaNaiUpdater/**'
      - 'BuildMpvUpscale2xAnimeJaNai/**'
      - 'installer/linux/**'
      - 'native/**'
      - 'tests/**'
      - 'tools/*linux*'
      - 'manager-source-ref.txt'
      - '.github/workflows/linux-port.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-and-manager:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Platform profile transactions
        shell: bash
        run: |
          mkdir -p artifacts
          if ! dotnet run --project tests/platform/PlatformTests.csproj > artifacts/platform-tests.log 2>&1; then
            cat artifacts/platform-tests.log
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -n 12 artifacts/platform-tests.log)
            exit 1
          fi
          cat artifacts/platform-tests.log
      - name: Updater preservation regressions
        shell: bash
        run: |
          python tests/updater-regressions/generate.py artifacts/updater-checks
          dotnet run --project artifacts/updater-checks
      - name: Download cache integrity and offline reuse
        run: dotnet run --project tests/download-cache/DownloadCacheTests.csproj
      - name: Offline Linux package regressions
        if: runner.os == 'Linux'
        run: python3 tests/platform/package_check.py
      - name: Resolve pinned HDR Manager source
        shell: bash
        run: echo "MANAGER_REF=$(cat manager-source-ref.txt)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: Ta2b/AnimeJaNaiManager-HDR
          ref: ${{ env.MANAGER_REF }}
          path: manager
      - name: Profile persistence and IPC
        shell: bash
        run: dotnet run --project manager/tests/ProfileRoundTrip/ProfileRoundTrip.csproj -p:PlatformSource="$GITHUB_WORKSPACE/AnimeJaNaiPlatform/PlatformServices.cs"
      - name: Settings UI and rendering regressions
        shell: bash
        run: dotnet run --project manager/tests/SettingsUi -p:RuntimeIdentifier=${{ matrix.rid }} -p:PlatformSource="$GITHUB_WORKSPACE/AnimeJaNaiPlatform/PlatformServices.cs" -- artifacts/settings.png
      - name: Compile platform helper, updater and Manager
        shell: bash
        run: |
          dotnet publish AnimeJaNaiPlatform/AnimeJaNaiPlatform.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o check-platform
          dotnet publish AnimeJaNaiUpdater/AnimeJaNaiUpdater.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o check-updater
          dotnet publish manager/AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PlatformSource="$GITHUB_WORKSPACE/AnimeJaNaiPlatform/PlatformServices.cs" -o check-manager
      - name: Repeat Linux publish and verify native graphics libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish manager/AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj -c Release -r linux-x64 --self-contained true -p:PlatformSource="$GITHUB_WORKSPACE/AnimeJaNaiPlatform/PlatformServices.cs" -o check-manager
          test -s check-manager/libSkiaSharp.so
          test -s check-manager/libHarfBuzzSharp.so

  ort-backend:
    # Experimental engine (ONNX Runtime with the MIGraphX / OpenVINO providers). This job only
    # proves that it builds on Linux and runs a profile on the CPU provider; it does not block
    # the release while the engine is not packaged.
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONNX Runtime with the OpenVINO provider and the configuration parser
        # Headers from the ONNX Runtime release, libraries from Intel's wheel of the same version:
        # it carries the OpenVINO provider and the OpenVINO runtime (CPU, GPU and NPU plugins).
        # The engine is built against this version on purpose: vendor builds lag behind upstream,
        # and a library older than the headers refuses to load.
        env:
          ORT_VERSION: 1.24.1
        run: |
          curl -fsSL --retry 3 -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          mkdir ort && tar -xzf ort.tgz -C ort --strip-components=1
          rm -rf ort/lib && mkdir ort/lib wheel
          python3 -m pip download "onnxruntime-openvino==$ORT_VERSION" --no-deps --only-binary=:all: \
            --python-version 3.12 --platform manylinux_2_28_x86_64 -d wheel
          unzip -q wheel/*.whl 'onnxruntime/capi/*.so*' 'onnxruntime/ThirdPartyNotices.txt' 'onnxruntime/LICENSE' -d wheel/x || true
          # One file per library, named by its soname; the wheel repeats the versioned names.
          for f in wheel/x/onnxruntime/capi/*.so*; do
            case "$f" in *pybind11*) continue;; esac
            name="$(objdump -p "$f" | awk '/SONAME/ {print $2}')"
            [ -n "$name" ] || name="$(basename "$f")"
            [ -e "ort/lib/$name" ] || cp "$f" "ort/lib/$name"
          done
          ln -s libonnxruntime.so.1 ort/lib/libonnxruntime.so
          cp wheel/x/onnxruntime/ThirdPartyNotices.txt ort/lib/ONNXRuntime-OpenVINO-ThirdPartyNotices.txt 2>/dev/null || true
          ls -la ort/lib
          test -s ort/lib/libonnxruntime.so.1
          test -s ort/lib/libonnxruntime_providers_openvino.so
          git clone --depth 1 --branch v0.11.1 https://github.com/the-database/animejanai-inference.git aji-source
      - name: Build the ONNX Runtime engine
        run: |
          cmake -S native/linux-ort -B ort-build -DCMAKE_BUILD_TYPE=Release -DORT_ROOT="$GITHUB_WORKSPACE/ort" -DAJI_SOURCE="$GITHUB_WORKSPACE/aji-source"
          cmake --build ort-build -j 4
      - name: Run a profile on the CPU provider
        run: |
          {
            echo '[global]'; echo 'config_version=3'; echo 'backend=TensorRT'; echo 'default_slot=1'
            echo '[slot_1]'; echo 'profile_name=ci'
            echo 'chain_1_min_resolution=0x0'; echo 'chain_1_max_resolution=1920x1080'
            echo 'chain_1_min_fps=0'; echo 'chain_1_max_fps=0'
            echo 'chain_1_model_1_resize_height_before_upscale=0'
            echo 'chain_1_model_1_resize_factor_before_upscale=100'
            echo 'chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16'
          } > ort-ci.conf
          AJI_ORT_PROVIDER=cpu ort-build/animejanai-ort-test ort-ci.conf BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx 1 320 180 3 | tee ort-ci.log
          grep -q 'plan: 640x360 active=1' ort-ci.log
          grep -q 'Backend: ONNX Runtime/CPU' ort-stats.txt
      - name: A frame cut in bands must equal the whole frame
        # Several devices (GPU+ANE on Apple Silicon) each take a band of the frame. With the CPU
        # provider on every band, the output must be the same bytes as the whole frame.
        run: |
          models=BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx
          AJI_TEST_DUMP=whole.rgb AJI_ORT_PROVIDER=cpu ort-build/animejanai-ort-test ort-ci.conf "$models" 1 640 360 2 CPU | tail -1
          AJI_TEST_DUMP=bands.rgb AJI_ORT_PROVIDER=cpu ort-build/animejanai-ort-test ort-ci.conf "$models" 1 640 360 2 CPU+CPU | tee bands.log | tail -2
          grep -q 'rows 0-180 + CPU rows 180-360' bands.log
          cmp whole.rgb bands.rgb
          AJI_ORT_SPLIT=65 AJI_TEST_DUMP=bands65.rgb AJI_ORT_PROVIDER=cpu ort-build/animejanai-ort-test ort-ci.conf "$models" 1 640 360 2 CPU+CPU | tail -2
          cmp whole.rgb bands65.rgb
      - name: Run the same profile through the OpenVINO provider (CPU device)
        # No Intel GPU on the runner: this proves that the provider and the OpenVINO runtime load
        # and run the model. The GPU device needs the host's Intel OpenCL driver.
        run: |
          AJI_ORT_PROVIDER=openvino ort-build/animejanai-ort-test ort-ci.conf BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx 1 320 180 3 CPU | tee ort-openvino.log
          grep -q 'plan: 640x360 active=1' ort-openvino.log
          grep -q 'Backend: ONNX Runtime/OpenVINO' ort-stats.txt
      - name: Bundle the engine with the OpenVINO build of ONNX Runtime
        # MIGraphX: replace libonnxruntime.so.1 with AMD's build (1.24 or newer) and its provider libraries.
        run: |
          mkdir ort-bundle
          cp ort-build/libaji_ort.so ort-build/animejanai-ort-test ort-bundle/
          cp -L ort/lib/*.so* ort/lib/*.txt ort-bundle/
          rm -f ort-bundle/libonnxruntime.so
          du -sh ort-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ort-backend-linux-x64
          path: ort-bundle/
          if-no-files-found: error
          retention-days: 7

  vulkan-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git libvulkan-dev mesa-vulkan-drivers vulkan-tools python3-venv
      - name: Restore pinned Vulkan bundle
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: vulkan-bundle
          key: vulkan-ubuntu24-${{ runner.arch }}-${{ hashFiles('native/linux-vulkan/CMakeLists.txt', 'native/linux-vulkan/aji_vulkan.cpp', 'native/linux-vulkan/aji_vulkan.h', 'native/linux-vulkan/convert_span.py', 'native/linux-vulkan/smoke.cpp', 'installer/linux/build-inference.sh', 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx/*SPANF3*') }}
      - name: Install model validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/model-python"
          "$RUNNER_TEMP/model-python/bin/pip" install onnx==1.23.2 numpy==2.5.4 onnxruntime==1.31.0
      - name: Build pinned Vulkan backend and convert the shipped models
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          AJ_PYTHON="$RUNNER_TEMP/model-python/bin/python" bash installer/linux/build-inference.sh "$RUNNER_TEMP/vulkan-work" "$GITHUB_WORKSPACE/vulkan-bundle" BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx
      - name: Model parity through software Vulkan (physical GPU validation remains separate)
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vulkan-runtime"
          mkdir -m700 "$XDG_RUNTIME_DIR"
          device="$(vulkaninfo --summary 2>/dev/null | sed -n 's/^[[:space:]]*deviceName[[:space:]]*=[[:space:]]*//p' | head -1)"
          test -n "$device"
          "$RUNNER_TEMP/model-python/bin/python" tests/inference/model_parity.py vulkan-bundle BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx --device "$device" --report artifacts/vulkan-model-parity-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-backend-linux-x64
          path: vulkan-bundle/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-parity-report
          path: |
            vulkan-bundle/inference/vulkan-build-info.txt
            artifacts/vulkan-model-parity-ci.json
