name: Qualify Core ML stable manifests and native cache cycle
# A targeted one-off qualification; no repeated release benchmark.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-cycle:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse verified release models without reconversion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir source-model
          gh release download 3.8.0.87 --repo "$GITHUB_REPOSITORY" --dir source-model \
            --pattern mpv-AnimeJaNai-HDR-v3.8.0.87-macos-arm64.zip \
            --pattern mpv-AnimeJaNai-HDR-v3.8.0.87-macos-arm64.zip.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          source=Path('source-model/mpv-AnimeJaNai-HDR-v3.8.0.87-macos-arm64.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest()==Path(str(source)+'.sha256').read_text().split()[0]
          prefix='mpv AnimeJaNai.app/Contents/Resources/animejanai/onnx/'
          with zipfile.ZipFile(source) as archive:
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.startswith(prefix):continue
                  relative=member.filename[len(prefix):]
                  if 'Performance' not in relative or not (relative.endswith('.mlpatch') or '.mlpackage/' in relative):continue
                  assert '..' not in Path(relative).parts and not Path(relative).is_absolute()
                  target=Path('models')/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(archive.read(member))
          assert len(list(Path('models').glob('*Performance*.mlpatch')))==2
          PY
      - name: Compile the native probe and content identity helper
        run: |
          python tests/apple/coreml_manifest_check.py
          clang++ -std=c++17 -O2 -fobjc-arc -mmacosx-version-min=13.3 -Inative/linux-ort \
            tests/apple/coreml_placement_probe.mm native/apple/exec_coreml.mm native/linux-ort/mlpatch.cpp \
            -framework Foundation -framework CoreML -framework CoreVideo -framework Accelerate -o cache-probe
          codesign --force -s - cache-probe
          clang++ -std=c++17 -O2 tests/cache/coreml_identity_cli.cpp native/linux-ort/mlpatch.cpp -o identity
      - name: Qualify stable IDs, native hit, weights-only rebuild and recovery
        run: |
          python tests/apple/coreml_cache_cycle.py --models models --probe cache-probe --identity identity --work results
          sw_vers > results/machine.txt
          uname -m >> results/machine.txt
          sysctl -n machdep.cpu.brand_string >> results/machine.txt
      - name: Preserve concise qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-cache-evidence
          path: |
            results/*.json
            results/*.log
            results/*.txt
          if-no-files-found: warn
