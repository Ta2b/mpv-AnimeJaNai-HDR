name: Upstream watch

# Weekly: opens one issue per new upstream release (AnimeJaNai and AnimeJaNai Manager), so the
# HDR changes can be carried over to it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
    - name: Check upstream releases
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ "$(gh api "repos/$REPO" --jq .has_issues)" != "true" ]; then
          echo "::error::Issues are disabled on $REPO: enable them in Settings > General > Features > Issues."
          exit 1
        fi
        gh label create upstream --repo "$REPO" --color 0E8A16 \
          --description 'New upstream release to merge' 2>/dev/null || true
        for upstream in the-database/mpv-upscale-2x_animejanai the-database/AnimeJaNaiManager; do
          tag=$(gh release view --repo "$upstream" --json tagName --jq .tagName 2>/dev/null || true)
          [ -n "$tag" ] || { echo "$upstream: no release"; continue; }
          title="Upstream release: $upstream $tag"
          found=$(gh issue list --repo "$REPO" --state all --label upstream --search "\"$title\" in:title" \
            --json title --jq "map(select(.title == \"$title\")) | length")
          if [ "$found" != "0" ]; then echo "$title: already tracked"; continue; fi
          url="https://github.com/$upstream/releases/tag/$tag"
          notes=$(gh release view "$tag" --repo "$upstream" --json body --jq .body | head -c 60000)
          printf '%s\n\n%s\n\n---\n\n%s\n' \
            "New release: $url" \
            "To carry the HDR changes over: rebase the HDR branch on $tag, run the HDR tests workflow, then bump release-version.txt and push to the release branch (see docs/RELEASE.md)." \
            "$notes" > body.md
          gh issue create --repo "$REPO" --title "$title" --label upstream --body-file body.md
        done
