name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version (blank uses release-version.txt)'
        type: string
        default: ''
      platform:
        description: 'Platforms to build'
        type: choice
        options: [both, windows, linux]
        default: both

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      platform: ${{ steps.resolve.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Validate release options
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          version="${REQUESTED_VERSION:-$(cat release-version.txt)}"
          platform="${REQUESTED_PLATFORM:-both}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || { echo 'Invalid release version' >&2; exit 1; }
          case "$platform" in both|windows|linux) ;; *) exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

  hdr-tests:
    uses: ./.github/workflows/hdr-tests.yml

  platform-checks:
    uses: ./.github/workflows/linux-port.yml

  build-windows:
    needs: [prepare, hdr-tests, platform-checks]
    if: needs.prepare.outputs.platform != 'linux'
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'  # Must match <TargetFramework> in BuildMpvUpscale2xAnimeJaNai.csproj

    - name: Publish .NET Core app
      run: dotnet publish BuildMpvUpscale2xAnimeJaNai/BuildMpvUpscale2xAnimeJaNai.csproj -c Release -o publish

    - name: Build shared platform helper (Windows)
      run: dotnet publish AnimeJaNaiPlatform/AnimeJaNaiPlatform.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/platform-win-x64

    - name: Run the console app
      # --packs also emits component-*.7z + packs.json (publish/packs-v<ver>/) for the
      # AnimeJaNai Manager (updater --components/--install/--remove/--auto).
      run: ./publish/BuildMpvUpscale2xAnimeJaNai.exe ${{ env.VERSION }} --packs

    - name: Build updater and add it to the package
      shell: pwsh
      run: |
        dotnet publish AnimeJaNaiUpdater/AnimeJaNaiUpdater.csproj -c Release -o updater-publish
        Copy-Item updater-publish/AnimeJaNaiUpdater.exe "publish/mpv-upscale-2x_animejanai-v${{ env.VERSION }}/AnimeJaNaiUpdater.exe" -Force

    - name: Install 7zip
      run: choco install 7zip -y

    # Setup installer (per-user, GPU-aware component picker), wrapping the same
    # slim core tree. The component packs install on demand post-install via the
    # updater, so the installer stays small.
    - name: Build setup installer
      shell: pwsh
      run: |
        choco install innosetup -y
        $ver = "${{ env.VERSION }}"
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
          "/DAppVersion=$ver" `
          "/DSourceDir=$(Resolve-Path "publish/mpv-upscale-2x_animejanai-v$ver")" `
          "/O$(Get-Location)" `
          installer/animejanai.iss

    # The "full package" is the slim core: hardware-specific components ship
    # as the component-*.7z assets and install on demand via the Manager.
    - name: Create 7zip archive of the artifact (full package)
      run: 7z a -t7z -mx=9 -v1900m mpv-upscale-2x_animejanai-full-package-${{ env.VERSION }}.7z ./publish/mpv-upscale-2x_animejanai-v${{ env.VERSION }}

    - name: Create overlay archive and stage manifest
      shell: pwsh
      run: |
        $ver = "${{ env.VERSION }}"
        $pkg = "publish/mpv-upscale-2x_animejanai-v$ver"
        # manifest.json is uploaded as a standalone asset so the updater can compare deps before downloading.
        Copy-Item "$pkg/manifest.json" "manifest.json" -Force
        # The lightweight overlay contains only the managed program files listed in the manifest,
        # archived relative to the install root so it overlays directly onto an existing install.
        $paths = (Get-Content "$pkg/manifest.json" -Raw | ConvertFrom-Json).overlay_paths
        $out = Join-Path (Get-Location) "mpv-upscale-2x_animejanai-overlay-$ver.7z"
        Push-Location $pkg
        & 7z a -t7z -mx=9 $out @paths
        Pop-Location

    - name: Upload Windows release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-windows
        if-no-files-found: error
        retention-days: 7
        path: |
          mpv-AnimeJaNai-HDR-Setup-*.exe
          mpv-upscale-2x_animejanai-full-package-*.7z.*
          mpv-upscale-2x_animejanai-overlay-*.7z
          manifest.json
          publish/packs-v*/component-*.7z
          publish/packs-v*/packs.json

  build-linux:
    needs: [prepare, hdr-tests, platform-checks]
    if: needs.prepare.outputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Free space for native builds, component packs and AppImage
      run: |
        sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h "$GITHUB_WORKSPACE"

    - name: Install portable packaging tools
      run: sudo apt-get update && sudo apt-get install -y zstd jq patchelf libfuse2t64

    - name: Install native Wayland build dependencies
      run: sudo apt-get install -y build-essential git cmake python3-venv meson ninja-build pkg-config nasm libass-dev libvulkan-dev libxkbcommon-dev libwayland-dev libxml2-dev libffi-dev libexpat1-dev liblua5.2-dev liblcms2-dev libx11-dev libxrandr-dev libxss-dev libxcursor-dev libxi-dev libxpresent-dev libxinerama-dev libpulse-dev libasound2-dev libshaderc-dev spirv-cross libspirv-cross-c-shared-dev glslang-dev libfreetype-dev libfontconfig-dev libfribidi-dev libharfbuzz-dev libunibreak-dev autoconf automake libtool

    - name: Restore pinned native Wayland player
      id: native-cache
      uses: actions/cache/restore@v4
      with:
        path: native-bundle
        key: wayland-ubuntu24-${{ runner.arch }}-${{ hashFiles('installer/linux/build-native.sh', 'native/linux-vulkan/install-filter.py', 'native/linux-vulkan/vf_animejanai_vulkan.c', 'native/linux-vulkan/aji_vulkan.h') }}

    - name: Build pinned native player with Wayland required
      if: steps.native-cache.outputs.cache-hit != 'true'
      run: installer/linux/build-native.sh "$RUNNER_TEMP/native-work" "$GITHUB_WORKSPACE/native-bundle"

    - name: Validate and cache the native player immediately
      run: |
        if ! LD_LIBRARY_PATH="$GITHUB_WORKSPACE/native-bundle" native-bundle/mpv --version > native-validation.log 2>&1; then
          while IFS= read -r line; do printf '::error::%s\n' "$line"; done < native-validation.log
          exit 1
        fi
        cat native-validation.log
        LD_LIBRARY_PATH="$GITHUB_WORKSPACE/native-bundle" native-bundle/mpv --vf=help | grep animejanai-vulkan

    - name: Save validated native Wayland player
      if: steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: native-bundle
        key: ${{ steps.native-cache.outputs.cache-primary-key }}

    - name: Configure native Wayland bundle and reclaim build workspace
      run: |
        echo "MPV_LINUX_LOCAL=$GITHUB_WORKSPACE/native-bundle" >> "$GITHUB_ENV"
        rm -rf "$RUNNER_TEMP/native-work"
        df -h "$GITHUB_WORKSPACE"

    - name: Reuse the Vulkan backend validated by platform checks
      uses: actions/download-artifact@v4
      with:
        name: vulkan-backend-linux-x64
        path: vulkan-bundle

    - name: Configure validated inference bundle
      run: |
        chmod +x vulkan-bundle/inference/animejanai-vulkan-test
        echo "VULKAN_LOCAL=$GITHUB_WORKSPACE/vulkan-bundle" >> "$GITHUB_ENV"

    - name: Resolve pinned HDR Manager source
      run: echo "MANAGER_REF=$(cat manager-source-ref.txt)" >> "$GITHUB_ENV"

    - name: Checkout HDR Manager source
      uses: actions/checkout@v4
      with:
        repository: Ta2b/AnimeJaNaiManager-HDR
        ref: ${{ env.MANAGER_REF }}
        path: manager

    - name: Build Linux HDR Manager from source
      run: |
        dotnet publish manager/AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj -c Release -r linux-x64 --self-contained true -p:PlatformSource="$GITHUB_WORKSPACE/AnimeJaNaiPlatform/PlatformServices.cs" -o manager-publish
        mv manager-publish/AnimeJaNaiManager manager-publish/AnimeJaNaiManager-HDR
        echo "MANAGER_HDR_LOCAL=$GITHUB_WORKSPACE/manager-publish" >> "$GITHUB_ENV"

    - name: Publish assembler (host RID = linux-x64)
      run: dotnet publish BuildMpvUpscale2xAnimeJaNai/BuildMpvUpscale2xAnimeJaNai.csproj -c Release -o publish

    - name: Build shared platform helper (Linux)
      run: dotnet publish AnimeJaNaiPlatform/AnimeJaNaiPlatform.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/platform-linux-x64

    - name: Run assembler (linux-x64, with packs)
      # Uses the local Wayland bundle and downloads aji from its sibling release
      # and TensorRT .debs from NVIDIA's CUDA repo (TrtVersion in Program.cs).
      # --packs emits component-*.7z + packs.json and slims the core tree.
      run: |
        if ! ./publish/BuildMpvUpscale2xAnimeJaNai "$VER" --target linux-x64 --packs > linux-assembly.log 2>&1; then
          tail -n 80 linux-assembly.log
          while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -n 20 linux-assembly.log)
          exit 1
        fi
        cat linux-assembly.log

    - name: Build updater (linux-x64, single file)
      run: |
        dotnet publish AnimeJaNaiUpdater/AnimeJaNaiUpdater.csproj -c Release \
          -r linux-x64 --self-contained -p:PublishSingleFile=true -o updater-publish

    - name: Build benchmark tool (linux-x64) into the tree
      run: |
        dotnet publish AnimeJaNaiBenchmark/AnimeJaNaiBenchmark.csproj -c Release \
          -r linux-x64 --self-contained -p:PublishSingleFile=true \
          -o "publish/mpv-upscale-2x_animejanai-v$VER/animejanai/benchmarks"
        chmod +x "publish/mpv-upscale-2x_animejanai-v$VER/animejanai/benchmarks/AnimeJaNaiBenchmark" \
                 "publish/mpv-upscale-2x_animejanai-v$VER/animejanai/benchmarks/animejanai_benchmark_all.sh" 2>/dev/null || true

    - name: Package portable tarball (+ updater + install scripts)
      run: |
        chmod +x installer/linux/*.sh
        installer/linux/package-tarball.sh \
          "publish/mpv-upscale-2x_animejanai-v$VER" updater-publish/AnimeJaNaiUpdater "$VER" .

    - name: Build AppImage with Vulkan, RIFE and the TensorRT runtime
      # Vulkan/SPAN/RIFE stay in the core; optional TensorRT kernels remain packs.
      run: |
        full="appimage-tree/mpv-upscale-2x_animejanai-v$VER"
        mkdir -p "$full"
        cp -a "publish/mpv-upscale-2x_animejanai-v$VER/." "$full/"
        cp -f updater-publish/AnimeJaNaiUpdater "$full/AnimeJaNaiUpdater"
        chmod +x "$full/AnimeJaNaiUpdater"
        "$GITHUB_WORKSPACE/publish/mpv-upscale-2x_animejanai-v$VER/7zz" \
          x -snl -y -o"$full" "publish/packs-v$VER/component-trt-runtime-linux-x64.7z"
        if ! installer/linux/build-appimage.sh "$full" "$VER" . > appimage-build.log 2>&1; then
          tail -n 80 appimage-build.log
          while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -n 20 appimage-build.log)
          exit 1
        fi
        cat appimage-build.log

    - name: Overlay archive + RID-suffixed manifest
      # Lightweight program-file overlay (the assembler already emits RID-suffixed
      # component packs + packs-linux-x64.json).
      run: |
        pkg="publish/mpv-upscale-2x_animejanai-v$VER"
        cp "$pkg/manifest.json" "manifest-linux-x64.json"
        mapfile -t paths < <(jq -r '.overlay_paths[]' "$pkg/manifest.json")
        ( cd "$pkg" && "$GITHUB_WORKSPACE/$pkg/7zz" a -t7z -mx=9 \
            "$GITHUB_WORKSPACE/mpv-upscale-2x_animejanai-overlay-$VER-linux-x64.7z" "${paths[@]}" )

    - name: Upload Linux test packages
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        if-no-files-found: error
        retention-days: 14
        path: |
          *-linux-x64.tar.zst
          *.AppImage
          *-linux-x64.7z
          manifest-linux-x64.json
          publish/packs-v*/component-*-linux-x64.7z
          publish/packs-v*/packs-linux-x64.json


  publish:
    # Builds can run independently; asset uploads are serialized and never cancelled.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    needs: [prepare, build-windows, build-linux]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download Windows assets
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: assets
      - name: Download Linux assets
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: assets
      - name: Flatten release assets and record SHA-256 checksums
        run: |
          mkdir release-assets
          while IFS= read -r -d '' source; do
            name="${source##*/}"
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate release asset: $name" >&2; exit 1
            fi
            cp "$source" "release-assets/$name"
          done < <(find assets -type f -print0)
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Publish Windows and Linux in the same release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          commit: ${{ github.sha }}
          draft: false
          prerelease: false
          makeLatest: ${{ needs.build-windows.result == 'success' }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          body: |
            mpv-AnimeJaNai HDR ${{ env.VERSION }} - Windows and Linux in one release.
            Windows: run Setup or extract the full package and launch mpvnet.exe. Existing asset names are preserved.
            Linux x64 (experimental): extract the tar.zst and run mpv-animejanai, or use the AppImage.
            Linux includes the HDR Manager, NCNN/Vulkan AnimeJaNai SPAN upscaling and RIFE 4.6 on AMD/NVIDIA.
            One shared display section, automatic brightness/gamut, OLED off; system HDR followed and Natural grading enabled on HDR output.
            New installs start with Performance without RIFE. Existing settings are preserved.
            Physical NVIDIA RTX 4050 and HDR-screen validation remain outstanding. Local GPU checks are functional, not performance benchmarks.
