name: Qualify resident Metal SPAN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm native Metal device and preserve machine details
        run: |
          mkdir results
          cat > device.mm <<'CPP'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <cstdio>
          int main(){@autoreleasepool {id<MTLDevice> d=MTLCreateSystemDefaultDevice();
          if(!d){std::fprintf(stderr,"No native Metal device; qualification unavailable\n");return 2;}
          std::printf("device=%s registry=%llu unified=%d\n",[[d name] UTF8String],d.registryID,d.hasUnifiedMemory);}}
          CPP
          clang++ -fobjc-arc device.mm -framework Foundation -framework Metal -o device
          ./device > results/device.txt
          sw_vers >> results/device.txt
          uname -m >> results/device.txt
      - name: Reuse the already published real models and fixed native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir model-source models
          gh release download 3.8.0.91 --repo "$GITHUB_REPOSITORY" --dir model-source \
            --pattern mpv-AnimeJaNai-HDR-v3.8.0.91-macos-arm64.zip \
            --pattern mpv-AnimeJaNai-HDR-v3.8.0.91-macos-arm64.zip.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          p=Path('model-source/mpv-AnimeJaNai-HDR-v3.8.0.91-macos-arm64.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==Path(str(p)+'.sha256').read_text().split()[0]
          prefix='mpv AnimeJaNai.app/Contents/Resources/animejanai/onnx/'
          with zipfile.ZipFile(p) as z:
            for name in z.namelist():
              if not name.startswith(prefix) or not name.endswith(('.ajm','.ajw')) or '_Performance_' not in name:continue
              rel=name[len(prefix):];assert '/' not in rel and '..' not in rel
              Path('models',rel).write_bytes(z.read(name))
          assert len(list(Path('models').glob('*.ajm')))==2
          PY
          curl -fsSL --retry 3 -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-osx-arm64-1.31.0.tgz
          mkdir ort-x && tar -xzf ort.tgz -C ort-x
          header="$(find ort-x -name onnxruntime_cxx_api.h -print -quit)"
          mv "$(dirname "$(dirname "$header")")" ort
          git clone --depth 1 --branch v0.11.1 https://github.com/the-database/animejanai-inference.git parser
      - name: Compile base and candidate with unchanged models and options
        run: |
          git fetch --no-tags --depth=1 origin c7efddcab20054922ce5a31dea1939adbd51d7e8
          git worktree add --detach baseline c7efddcab20054922ce5a31dea1939adbd51d7e8
          for variant in baseline candidate; do
            source=native/linux-ort
            [ "$variant" = candidate ] || source=baseline/native/linux-ort
            cmake -S "$source" -B "$variant-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DORT_ROOT="$PWD/ort" -DAJI_SOURCE="$PWD/parser"
            cmake --build "$variant-build" --target aji_ort -j 4
            codesign --force -s - "$variant-build/libaji_ort.dylib"
          done
      - name: Qualify first output before short timing and ineligible fallback
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          names=sorted(p.stem for p in Path('models').glob('*.ajm'))
          conf='[global]\nbackend=Metal\nrife_engine=quality\nengine_reuse=off\nengine_boost=no\nengine_tiles=1\n[slot_1]\nchain_1_rife=no\n'
          conf+='chain_1_model_1_name='+names[0]+'\nchain_1_model_2_name='+names[1]+'\n'
          Path('results/resident.conf').write_text(conf)
          Path('results/resize.conf').write_text(conf+'chain_1_model_2_resize_factor_before_upscale=50\n')
          spec={k:str(Path(v).resolve()) for k,v in {'baseline':'baseline-build/libaji_ort.dylib','candidate':'candidate-build/libaji_ort.dylib','models':'models','conf':'results/resident.conf','resize_conf':'results/resize.conf','output':'results'}.items()}
          Path('results/spec.json').write_text(json.dumps(spec,indent=2)+'\n')
          PY
          python tests/apple/metal_resident_chain_probe.py results/spec.json > results/native.log 2>&1
      - name: Preserve evidence even when unavailable or unsuccessful
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-resident-span-evidence
          path: |
            results/*.txt
            results/*.json
            results/*.log
            results/*.conf
          if-no-files-found: warn
