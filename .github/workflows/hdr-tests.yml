name: HDR tests

# Controller tests (Lua, mocked mpv) and shader checks (real mpv/libplacebo on lavapipe) for the
# HDR overlay. Also called by Deploy before a release is built.
on:
  push:
    branches: [hdr-3.8, hdr]
    paths:
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/**'
      - 'tests/hdr/**'
      - '.github/workflows/hdr-tests.yml'
  pull_request:
    paths:
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/**'
      - 'tests/hdr/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install Lua, mpv and a software Vulkan driver
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends luajit lua5.2 mpv mesa-vulkan-drivers \
          xvfb xauth python3-numpy python3-pil

    - name: Controller tests (LuaJIT and Lua 5.2)
      run: tests/hdr/run.sh

    - name: Shader checks (libplacebo)
      run: python3 tests/hdr/shader_check.py
