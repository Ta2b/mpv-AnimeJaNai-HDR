name: Qualify Core ML program identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  program-key:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse the normalized model already delivered in .88
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir source-model
          gh release download 3.8.0.88 --repo "$GITHUB_REPOSITORY" --dir source-model \
            --pattern mpv-AnimeJaNai-HDR-v3.8.0.88-macos-arm64.zip \
            --pattern mpv-AnimeJaNai-HDR-v3.8.0.88-macos-arm64.zip.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          source=Path('source-model/mpv-AnimeJaNai-HDR-v3.8.0.88-macos-arm64.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest()==Path(str(source)+'.sha256').read_text().split()[0]
          prefix='mpv AnimeJaNai.app/Contents/Resources/animejanai/onnx/'
          with zipfile.ZipFile(source) as archive:
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.startswith(prefix):continue
                  relative=member.filename[len(prefix):]
                  if 'Sharp1_Performance' not in relative or not (relative.endswith('.mlpatch') or '.mlpackage/' in relative):continue
                  assert '..' not in Path(relative).parts and not Path(relative).is_absolute()
                  target=Path('models')/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(archive.read(member))
          assert len(list(Path('models').glob('*Sharp1_Performance*.mlpatch')))==1
          PY
      - name: Compile baseline and candidate against the same native interface
        run: |
          baseline=37fd12cc9e73bc471e7a4841a413501ec82af9ca
          git fetch --no-tags --depth=1 origin "$baseline"
          mkdir baseline results
          git show "$baseline:native/apple/exec_coreml.mm" > baseline/exec_coreml.mm
          for variant in baseline candidate; do
            source=baseline/exec_coreml.mm
            [ "$variant" = baseline ] || source=native/apple/exec_coreml.mm
            clang++ -std=c++17 -O2 -fobjc-arc -mmacosx-version-min=13.3 -Inative/linux-ort -Inative/apple \
              tests/apple/coreml_placement_probe.mm "$source" native/linux-ort/mlpatch.cpp \
              -framework Foundation -framework CoreML -framework CoreVideo -framework Accelerate -o "$variant-probe"
            codesign --force -s - "$variant-probe"
          done
      - name: Qualify the new namespace and one genuine native hit
        run: |
          model="$(basename "$(find models -maxdepth 1 -name '*.mlpatch' -print -quit)" .mlpatch)"
          mkdir cache
          AJI_COREML_NO_PLAN=1 ./baseline-probe "$PWD/models" "$model" "$PWD/cache" results/baseline.rgb > results/baseline.log 2>&1
          AJI_COREML_NO_PLAN=1 ./candidate-probe "$PWD/models" "$model" "$PWD/cache" results/candidate.rgb > results/candidate.log 2>&1
          find cache/native -maxdepth 1 -type d > results/folders-before-hit.txt
          AJI_COREML_NO_PLAN=1 ./candidate-probe "$PWD/models" "$model" "$PWD/cache" results/hit.rgb > results/hit.log 2>&1
          cmp results/baseline.rgb results/candidate.rgb
          cmp results/candidate.rgb results/hit.rgb
          sw_vers > results/machine.txt
          uname -m >> results/machine.txt
          sysctl -n machdep.cpu.brand_string >> results/machine.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          root=Path('results')
          logs={name:(root/(name+'.log')).read_text() for name in ('baseline','candidate','hit')}
          assert 'compiled cache miss:' in logs['baseline'] and 'compiled cache miss:' in logs['candidate']
          assert 'compiled cache hit:' in logs['hit'] and 'compiled cache miss:' not in logs['hit']
          identity=re.search(r'Core ML cache identity: p3-([0-9a-f]{64}) template (v2-[0-9a-f]{64}) compiler (.+) runtime (.+) host (\S+)',logs['candidate'])
          assert identity and identity.group(0) in logs['hit'],logs
          folders=[p for p in Path('cache/native').iterdir() if p.is_dir()]
          assert len(folders)==2 and sum('-p3-' in p.name for p in folders)==1
          assert set(Path('results/folders-before-hit.txt').read_text().splitlines())=={'cache/native',*(str(p) for p in folders)}
          for p in folders:assert (p/'model.mlmodelc').is_dir()
          result={'source':os.environ['GITHUB_SHA'],'passed':True,'native_hit':True,'old_namespace_preserved':True,
            'program_key':identity.group(1),'template_tag':identity.group(2),'compiler':identity.group(3),
            'runtime':identity.group(4),'host_architecture':identity.group(5),'pixels_exact':True,
            'output_sha256':hashlib.sha256((root/'candidate.rgb').read_bytes()).hexdigest(),
            'scope':'CoreML CPU256x256, new compile identity/cold load/hit only; AH244 weights/corruption proof reused, no FPS/GPU/ANE claim'}
          (root/'receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Preserve the targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-program-key-evidence
          path: |
            results/*.json
            results/*.txt
            results/*.log
          if-no-files-found: warn
