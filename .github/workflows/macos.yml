name: macOS
# Apple Silicon: the engine with its three ways of running a model (ONNX Runtime with Core ML,
# Core ML alone, Metal), the player application and a benchmark bundle to run on a real Mac.
# Experimental; never blocks a release.
on:
  workflow_dispatch:
  # On the release branch, the application and the benchmark bundle are added to the release.
  # Work branches (perf-...) are built too, so that their application can be tried before a merge.
  push:
    branches: [hdr-3.8, release, 'perf-**']
    paths:
      - 'release-version.txt'
      - 'native/linux-ort/**'
      - 'native/apple/**'
      - 'native/macos-bench/**'
      - 'native/linux-vulkan/**'
      - 'installer/macos/**'
      - 'AnimeJaNaiUpdater/**'
      - 'manager-source-ref.txt'
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/scripts/animejanai_update.lua'
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/hdr-tools/**'
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/user-shaders/**'
      - '.github/workflows/macos.yml'

permissions:
  contents: write

jobs:
  engine:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ORT_VERSION: 1.31.0
      ONNX: BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx
      PERF: 2x_AnimeJaNai_HD_V3.1Sharp1_Performance_SPANF3_b5f48_unshuffle_fp16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Helpers
        # The job log needs an account; annotations do not. note TITLE FILE [LEVEL] publishes the
        # last lines of a file as one annotation.
        run: |
          cat > "$RUNNER_TEMP/note" <<'EOF'
          #!/bin/bash
          body="$(tail -n "${LINES_KEPT:-30}" "$2" | cut -c1-320 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::${3:-notice} title=$1::${body:-empty}"
          EOF
          chmod +x "$RUNNER_TEMP/note"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Fetch ONNX Runtime (Core ML provider included) and the configuration parser
        run: |
          uname -m; sw_vers
          curl -fsSL --retry 3 -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz"
          mkdir ort-x && tar -xzf ort.tgz -C ort-x
          header="$(find ort-x -name onnxruntime_cxx_api.h -print -quit)"
          test -n "$header"
          mv "$(dirname "$(dirname "$header")")" ort
          ls -la ort ort/lib
          git clone --depth 1 --branch v0.11.1 https://github.com/the-database/animejanai-inference.git aji-source
      - name: Convert the models for the Apple engines
        # Core ML templates with their size tables, the Metal model files, and the ONNX variants
        # of the ONNX Runtime engine. The converter checks its own output (see its header).
        run: |
          pip install -q onnx==1.19.1 numpy==2.2.6 onnxruntime coremltools==9.0
          mkdir models check
          cp "$ONNX"/*SPANF3*.onnx models/
          for f in "$ONNX"/*SPANF3*.onnx; do
            python native/linux-ort/fuse_unshuffle.py "$f" "models/$(basename "${f%.onnx}").coreml.onnx"
          done
          if ! python native/apple/convert_models.py "$ONNX" models --keep-check check > convert.log 2>&1; then
            note "model conversion failed" convert.log error; exit 1
          fi
          grep -v 'Failed to load' convert.log | cut -c1-200
          ls models check
      - name: RIFE models for macOS
        # The other platforms download about forty models. Three are kept here: the latest, the
        # one before and the latest light one, with their picture size named so that Core ML,
        # which only takes models whose input size is known, accepts them.
        run: |
          curl -fsSL --retry 3 -o rife.7z "https://github.com/the-database/animejanai-inference/releases/download/models-rife-fp16-1/rife-fp16-1.7z"
          mkdir rife-all rife
          tar -xf rife.7z -C rife-all || { brew install sevenzip >/dev/null && 7zz x -y -orife-all rife.7z >/dev/null; }
          for name in rife_v4.26 rife_v4.25 rife_v4.22_lite; do
            source="$(find rife-all -name "$name.onnx" -print -quit)"
            test -n "$source" || { echo "::error title=RIFE model missing from the archive::$name"; exit 1; }
            python native/linux-ort/name_rife_dims.py "$source" "rife/$name.onnx"
          done
          ls -la rife
          rm -rf rife-all rife.7z
      - name: Build the engine
        run: |
          cmake -S native/linux-ort -B ort-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DORT_ROOT="$GITHUB_WORKSPACE/ort" -DAJI_SOURCE="$GITHUB_WORKSPACE/aji-source"
          if ! cmake --build ort-build -j 4 > build.log 2>&1; then
            tail -40 build.log
            grep -E 'error|Error' build.log | head -28 > errors.txt
            LINES_KEPT=28 note "engine build failed" errors.txt error
            # The lines around the first error, for the context a bare message lacks.
            grep -n -m1 -E 'error' build.log | cut -d: -f1 | { read n; sed -n "$((n > 3 ? n - 3 : 1)),$((n + 14))p" build.log > first.txt; }
            LINES_KEPT=18 note "first error in context" first.txt error
            exit 1
          fi
          grep -E 'warning' build.log | grep -E 'native/(apple|linux-ort)' | sort -u | head -12 > warnings.txt || true
          test -s warnings.txt && LINES_KEPT=12 note "engine build warnings" warnings.txt warning
          otool -L ort-build/libaji_ort.dylib
      - name: Persistent pixel workers, simultaneous calls and nesting
        run: |
          ort-build/animejanai-pixel-workers-test
          AJI_PIXEL_POOL=0 ort-build/animejanai-pixel-workers-test
      - name: Tile plans, reuse test and Core ML size patch
        run: |
          for package in check/*.mlpackage; do
            name="$(basename "$package" -1280x720.mlpackage)"
            ort-build/animejanai-tiles-test models "$name" "$package" 720 1280 > tiles.log 2>&1 || { note "tiles test failed" tiles.log error; exit 1; }
          done
          tail -6 tiles.log
      - name: Run a profile on the CPU provider
        # The pictures the other engines are compared with.
        run: |
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TILES=1 ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 320 180 3 | tee cpu.log
          grep -q 'plan: 640x360 active=1' cpu.log
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TILES=1 AJI_TEST_DUMP=ref-640.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 640 360 3 | tail -3
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TILES=1 AJI_TEST_DUMP=ref-720.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1280 720 3 | tail -3
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TILES=1 AJI_TEST_DUMP=ref-640-balanced.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 2 640 360 3 | tail -3
          # The core by itself: tiles, two devices and reuse give the same bytes as the whole frame.
          AJI_ORT_PROVIDER=cpu AJI_REUSE=tiles AJI_TEST_MOTION=corner AJI_TEST_COMPARE=ref-640.rgb AJI_TEST_TOLERANCE=0 \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 640 360 4 CPU+CPU | tee core.log
          grep -q 'computed 1 of 4' core.log
          # The Metal model file in plain C++ against ONNX Runtime.
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TEST_DUMP=ref-96.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 96 64 2 | tail -1
          AJI_ORT_PROVIDER=reference AJI_REUSE=off AJI_TEST_COMPARE=ref-96.rgb AJI_TEST_TOLERANCE=1 \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 96 64 2 | tail -2
      - name: ONNX Runtime with Core ML
        # The hosted runner is a virtual machine: this proves that Core ML takes the model and
        # gives the same picture, not how fast a real Mac is.
        run: |
          for device in CPU ALL GPU ANE; do
            echo "== $device"
            AJI_ORT_PROVIDER=coreml AJI_REUSE=off ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 320 180 5 $device 2>&1 | tee "coreml-$device.log" | tail -5 || true
          done
          grep -q 'plan: 640x360 active=1' coreml-CPU.log
          grep 'centre pixel' cpu.log coreml-*.log
          echo "== 1920x1080 through profile 1 (no resize in the benchmark bank), Core ML ALL"
          AJI_ORT_PROVIDER=coreml AJI_REUSE=off ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1920 1080 6 ALL 2>&1 | tee coreml-1080.log | tail -4
          echo "== what Core ML takes from the graph (1280x720): fused model, then original"
          rm -rf models/coreml-cache/1280x720-*
          AJI_ORT_LOG=0 AJI_ORT_PROVIDER=coreml AJI_REUSE=off ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1280 720 3 ALL > verbose-fused.log 2>&1 || true
          grep -E 'number of partitions|average after|Average|failed|is not supported|unsupported inputs' verbose-fused.log | cut -c1-330 | sort | uniq -c | head -20
          grep -q 'number of partitions supported by CoreML: 1 ' verbose-fused.log
          rm -rf models/coreml-cache/1280x720-*
          # A second size after the first: the compiled-model cache must not be shared between sizes.
          grep -q 'plan: 3840x2160 active=1' coreml-1080.log
          grep -q 'average after warmup (1 source frames):' coreml-1080.log
          echo "== two devices at once: four tiles shared by the GPU and the Neural Engine"
          AJI_ORT_PROVIDER=coreml AJI_REUSE=off AJI_TEST_COMPARE=ref-720.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1280 720 5 GPU+ANE 2>&1 | tee coreml-pair.log | tail -5
          grep -q 'plan: 2560x1440 active=1' coreml-pair.log
          grep -q 'Tiles: 2x2 of 704x396' coreml-pair.log
          grep -q 'COMPARE | largest difference [0-3] ' coreml-pair.log
          echo "== a width that is not a multiple of 32: padded for this engine, and what it gives when it is not"
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TILES=1 AJI_TEST_DUMP=ref-676.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 676 396 2 | tail -3
          AJI_ORT_PROVIDER=coreml AJI_REUSE=off AJI_TEST_COMPARE=ref-676.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 676 396 3 ALL 2>&1 | tee coreml-odd.log | tail -4
          AJI_ALIGN=2 AJI_ORT_PROVIDER=coreml AJI_REUSE=off AJI_TEST_COMPARE=ref-676.rgb ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 676 396 3 ALL 2>&1 | tee coreml-odd-unpadded.log | tail -4 || true
          grep -q 'COMPARE | largest difference' coreml-odd.log
          for f in coreml-ALL.log coreml-GPU.log coreml-ANE.log coreml-1080.log coreml-pair.log coreml-odd.log coreml-odd-unpadded.log; do
            grep -E '^RESULT|^COMPARE|^Devices' "$f" | cut -c1-300 > short.txt; note "onnxruntime ${f%.log}" short.txt
          done
      - name: Native Core ML
        # Every compute target, compared with the CPU picture. On the virtual machine Core ML may
        # run any of them on the CPU: what is proven is the model, the size patch and the wiring.
        run: |
          status=0
          for device in CPU GPU NPU AUTO; do
            AJI_ORT_PROVIDER=coremlnative AJI_REUSE=off AJI_TEST_COMPARE=ref-640.rgb \
              ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 640 360 4 $device > "native-$device.log" 2>&1 || echo "exit code $?" >> "native-$device.log"
            grep -E '^RESULT|^COMPARE|^Placement|failed|exit code' "native-$device.log" | cut -c1-300 > short.txt
            cat short.txt
            if grep -q 'COMPARE | largest difference [0-3] ' "native-$device.log"; then note "core ml native $device" short.txt
            else tail -12 "native-$device.log" | cut -c1-300 >> short.txt; note "core ml native $device FAILED" short.txt error; status=1; fi
          done
          echo "== Balanced, the pair GPU + Neural Engine on tiles with reuse, and a picture under 256 pixels"
          AJI_ORT_PROVIDER=coremlnative AJI_REUSE=off AJI_TEST_COMPARE=ref-640-balanced.rgb \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 2 640 360 3 GPU > native-balanced.log 2>&1 || echo "exit code $?" >> native-balanced.log
          AJI_ORT_PROVIDER=coremlnative AJI_REUSE=tiles AJI_TEST_MOTION=corner AJI_TEST_COMPARE=ref-720.rgb \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1280 720 5 GPU+NPU > native-pair.log 2>&1 || echo "exit code $?" >> native-pair.log
          AJI_ORT_PROVIDER=coremlnative AJI_REUSE=off \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 320 180 3 GPU > native-small.log 2>&1 || echo "exit code $?" >> native-small.log
          for f in native-balanced native-pair native-small; do
            grep -E '^RESULT|^COMPARE|^Tiles|^Devices|centre pixel|failed|exit code' "$f.log" | cut -c1-300 > short.txt
            cat short.txt
            if grep -q 'exit code\|failed' "$f.log"; then tail -12 "$f.log" | cut -c1-300 >> short.txt; note "core ml $f FAILED" short.txt error; status=1
            else note "core ml $f" short.txt; fi
          done
          grep -q 'COMPARE | largest difference [0-3] ' native-balanced.log || status=1
          grep -q 'COMPARE | largest difference [0-3] ' native-pair.log || status=1
          # The moving corner touches two of the twelve areas of 720p (one, and its neighbour's overlap).
          grep -q 'computed 2 of 12' native-pair.log || status=1
          grep 'centre pixel' cpu.log native-small.log
          ls models/coreml-cache/native | head
          exit $status
      - name: Metal
        # The runner's GPU is the host's, reached through a virtual device: unlike Core ML, Metal
        # really computes on it. The times of the variants below can be compared with each other.
        run: |
          status=0
          AJI_ORT_PROVIDER=metal AJI_REUSE=off AJI_TEST_COMPARE=ref-640.rgb \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 640 360 4 GPU > metal-gpu.log 2>&1 || echo "exit code $?" >> metal-gpu.log
          AJI_METAL_LAYOUT=nchw AJI_ORT_PROVIDER=metal AJI_REUSE=off AJI_TEST_COMPARE=ref-640.rgb \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 640 360 4 GPU > metal-planes.log 2>&1 || echo "exit code $?" >> metal-planes.log
          for variant in "AJI_METAL_LAYOUT=nhwc" "AJI_METAL_LAYOUT=nchw" "AJI_METAL_OPT=1" "AJI_TILES=2x2"; do
            env $variant AJI_ORT_PROVIDER=metal AJI_REUSE=off AJI_TEST_COMPARE=ref-720.rgb \
              ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1280 720 12 GPU > metal-time.log 2>&1 || echo "exit code $?" >> metal-time.log
            grep -E '^RESULT|^COMPARE|^Placement|failed|exit code' metal-time.log | cut -c1-300 > short.txt
            cat short.txt; note "metal 720p $variant" short.txt
          done
          AJI_ORT_PROVIDER=metal AJI_REUSE=off AJI_TEST_COMPARE=ref-640-balanced.rgb \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 2 640 360 3 GPU > metal-balanced.log 2>&1 || echo "exit code $?" >> metal-balanced.log
          # Metal on the GPU and Core ML on the Neural Engine, sharing the tiles of one frame.
          AJI_ORT_PROVIDER=metal AJI_REUSE=tiles AJI_TEST_MOTION=corner AJI_TEST_COMPARE=ref-720.rgb \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 1280 720 5 GPU+NPU > metal-pair.log 2>&1 || echo "exit code $?" >> metal-pair.log
          AJI_ORT_PROVIDER=metal AJI_REUSE=off \
            ort-build/animejanai-ort-test native/macos-bench/bench.conf models 1 320 180 3 GPU > metal-small.log 2>&1 || echo "exit code $?" >> metal-small.log
          for f in metal-gpu metal-planes metal-balanced metal-pair metal-small; do
            grep -E '^RESULT|^COMPARE|^Tiles|^Devices|^Placement|centre pixel|failed|exit code' "$f.log" | cut -c1-300 > short.txt
            cat short.txt
            if grep -q 'exit code\|failed' "$f.log"; then tail -14 "$f.log" | cut -c1-300 >> short.txt; note "$f FAILED" short.txt error; status=1
            else note "$f" short.txt; fi
          done
          for f in metal-gpu metal-planes metal-balanced metal-pair; do grep -q 'COMPARE | largest difference [0-3] ' "$f.log" || status=1; done
          grep 'centre pixel' cpu.log metal-small.log
          exit $status
      - name: RIFE through Core ML
        # Informative: annotations, never a failure of the job. The interpolation runs before the
        # upscale, on the same source frames whatever the provider, so the picture between two
        # frames can be compared with the CPU provider's. On this virtual machine Core ML computes
        # on the CPU: what is learnt is whether it takes the whole model, and the picture.
        run: |
          export AJI_TEST_RIFE_DIR="$PWD/rife"
          AJI_ORT_PROVIDER=cpu AJI_REUSE=off AJI_TEST_TRIO=rife-cpu ort-build/animejanai-ort-test native/macos-bench/bench.conf models 3 320 180 3 > rife-cpu.log 2>&1 || echo "exit code $?" >> rife-cpu.log
          grep -E '^plan|^RIFE|^RESULT|failed|exit code' rife-cpu.log | cut -c1-300 > short.txt; note "rife, cpu provider" short.txt
          for device in all gpu npu cpu; do
            AJI_ORT_LOG=0 AJI_ORT_PROVIDER=coremlnative AJI_RIFE_DEVICE=$device AJI_REUSE=off AJI_TEST_TRIO="rife-$device" \
              ort-build/animejanai-ort-test native/macos-bench/bench.conf models 3 320 180 4 GPU > "rife-$device.log" 2>&1 || echo "exit code $?" >> "rife-$device.log"
            {
              grep -E '^plan|^RIFE|^RESULT|exit code' "rife-$device.log" | cut -c1-300
              grep -E 'number of partitions supported by CoreML|number of nodes in the graph' "rife-$device.log" | sed 's/.*CoreMLExecutionProvider::GetCapability, //' | sort | uniq -c | head -6
              grep -iE 'not supported|unsupported' "rife-$device.log" | sed 's/.*\] //' | cut -c1-200 | sort | uniq -c | sort -rn | head -8
              python - "rife-cpu-between.rgb" "rife-$device-between.rgb" <<'EOF' 2>&1 | tail -1
          import sys, numpy as np
          a, b = (np.fromfile(p, dtype=np.uint8).astype(int) for p in sys.argv[1:3])
          d = abs(a - b)
          print('picture between two frames against the CPU provider: largest difference %d, mean %.3f, more than 3 levels: %.2f %%' % (d.max(), d.mean(), 100 * (d > 3).mean()))
          EOF
            } > short.txt 2>&1
            if grep -q '^RIFE: rife_v4.26' "rife-$device.log"; then note "rife through core ml, $device" short.txt
            else tail -6 "rife-$device.log" | cut -c1-300 >> short.txt; note "rife through core ml, $device: NOT RUNNING" short.txt warning; fi
          done
          exit 0
      - name: What failed
        # The last lines of every log of the steps above, as annotations.
        if: failure()
        run: |
          for f in $(ls -t *.log 2>/dev/null | head -9); do
            tail -16 "$f" | cut -c1-300 > short.txt
            LINES_KEPT=16 note "log $f" short.txt error
          done
      - name: Benchmark bundle
        run: |
          b=AnimeJaNai-mac-bench
          mkdir -p "$b/models"
          cp ort-build/libaji_ort.dylib ort-build/animejanai-ort-test "$b/"
          cp -a ort/lib/libonnxruntime*.dylib "$b/"
          cp native/macos-bench/bench.command native/macos-bench/bench.conf native/macos-bench/LISEZ-MOI.txt "$b/"
          for kind in Sharp1_Performance Sharp1_Balanced; do cp -R models/*"$kind"* "$b/models/"; done
          cp rife/*.onnx "$b/models/"
          chmod +x "$b/bench.command" "$b/animejanai-ort-test"
          # The test program finds the engine and ONNX Runtime next to itself.
          install_name_tool -add_rpath @loader_path "$b/animejanai-ort-test" 2>/dev/null || true
          install_name_tool -add_rpath @loader_path "$b/libaji_ort.dylib" 2>/dev/null || true
          codesign --force -s - "$b"/*.dylib "$b/animejanai-ort-test"
          ( cd "$b" && AJI_ORT_PROVIDER=cpu AJI_REUSE=off ./animejanai-ort-test bench.conf models 1 320 180 2 | tail -2 )
          # The RIFE line is left out of the check: whether Core ML runs it is reported by its own step.
          ( cd "$b" && bash bench.command essai > bench-try.log 2>&1; tail -16 bench-try.log | cut -c1-300 > short.txt; note "benchmark script, short run" short.txt; grep -q '^RESULT' resultats.txt; ! grep -v '^RIFE' resultats.txt | grep -q 'failed' )
          rm -rf "$b/models/coreml-cache" "$b/ort-stats.txt" "$b/resultats.txt" "$b/bench-try.log" "$b/short.txt"
          ditto -c -k --keepParent "$b" "$b.zip"
          ls -la "$b.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-bench
          path: AnimeJaNai-mac-bench.zip
          if-no-files-found: error
      - name: Engine files for the player
        run: |
          mkdir -p mac-engine/onnx
          cp ort-build/libaji_ort.dylib ort-build/animejanai-ort-test mac-engine/
          cp -L ort/lib/libonnxruntime.1.dylib mac-engine/libonnxruntime.1.dylib
          # Everything the three engines read besides the ONNX files of the repository.
          cp models/*.coreml.onnx models/*.ajm models/*.ajw models/*.mlpatch mac-engine/onnx/
          cp -R models/*.mlpackage mac-engine/onnx/
          mkdir -p mac-engine/rife && cp rife/*.onnx mac-engine/rife/
          cp native/macos-bench/bench.command native/macos-bench/bench.conf mac-engine/
          ls -la mac-engine mac-engine/onnx
      - uses: actions/upload-artifact@v4
        with:
          name: mac-engine
          path: mac-engine/
          if-no-files-found: error

  player:
    # mpv with the host-frame filter, bundled as an application with the engine, the models, the
    # Manager and the updater.
    needs: engine
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Helpers
        run: |
          cat > "$RUNNER_TEMP/note" <<'EOF'
          #!/bin/bash
          body="$(tail -n "${LINES_KEPT:-30}" "$2" | cut -c1-320 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::${3:-notice} title=$1::${body:-empty}"
          EOF
          chmod +x "$RUNNER_TEMP/note"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: |
          brew update >/dev/null
          brew install meson ninja pkgconf ffmpeg libplacebo libass luajit molten-vk vulkan-loader vulkan-headers little-cms2 uchardet zimg jpeg-turbo
          brew list --versions ffmpeg libplacebo libass molten-vk
      - name: Build mpv with the AnimeJaNai filter
        run: bash installer/macos/build-mpv.sh "$RUNNER_TEMP/mpv-work" "$GITHUB_WORKSPACE/mac-mpv"
      - uses: actions/download-artifact@v4
        with:
          name: mac-engine
          path: mac-engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Updater and Manager for the application
        # The updater is the program of the other platforms, published for Apple Silicon and
        # trimmed (the component packs it also manages do not exist on macOS). The Manager is the
        # build pinned by manager-source-ref.txt, as on the other platforms.
        run: |
          if ! dotnet publish AnimeJaNaiUpdater/AnimeJaNaiUpdater.csproj -c Release -r osx-arm64 --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=true -o updater-publish > updater-build.log 2>&1; then
            grep -E 'error' updater-build.log | head -20 > errors.txt; note "updater build failed" errors.txt error; exit 1
          fi
          ls -la updater-publish
          ref="$(tr -d '[:space:]' < manager-source-ref.txt)"
          if ! curl -fsSL --retry 3 -o manager.zip "https://github.com/Ta2b/AnimeJaNaiManager-HDR/releases/download/hdr-$ref/AnimeJaNaiManager-HDR-macos-arm64.zip"; then
            echo "::error title=manager not found::no macOS Manager in release hdr-$ref of Ta2b/AnimeJaNaiManager-HDR"; exit 1
          fi
          mkdir manager-app && ditto -x -k manager.zip manager-app
          test -x "manager-app/AnimeJaNai Manager.app/Contents/MacOS/AnimeJaNaiManager-HDR"
          codesign --verify --deep "manager-app/AnimeJaNai Manager.app"
      - name: Assemble the application
        run: |
          VER="$(tr -d '[:space:]' < release-version.txt)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "APP=mac-out/mpv AnimeJaNai.app" >> "$GITHUB_ENV"
          if ! bash installer/macos/package.sh mac-mpv/mpv.app mac-engine BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/onnx "$VER" mac-out \
              "manager-app/AnimeJaNai Manager.app" updater-publish/AnimeJaNaiUpdater > package.log 2>&1; then
            note "assembling the application failed" package.log error; exit 1
          fi
          tail -3 package.log
          du -sh "mac-out/mpv AnimeJaNai.app"
      - name: Play a synthetic clip through the filter
        # No display on the runner: null output. Proves that the bundled settings and script are
        # read, that the filter loads the engine and that Core ML processes frames.
        run: |
          rm -rf "$HOME/Library/Caches/AnimeJaNai"
          # Two minutes at most: a hang must still leave its log.
          perl -e 'alarm 120; exec @ARGV' "mac-out/mpv AnimeJaNai.app/Contents/MacOS/mpv-animejanai" av://lavfi:testsrc2=size=640x360:rate=24             --vo=null --ao=null --frames=12 --keep-open=no --log-file=run.log > console.log 2>&1 || echo "mpv exit code $?"
          tail -15 console.log
          tail -40 run.log | cut -c1-230
          echo ==== filtered
          grep -iE 'config|script|animejanai|aji|osxbundle|error|fail|vf\]' run.log | cut -c1-230 | head -70
          cat "$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
          # Both scripts loaded, no Lua error, data folder created.
          grep -q 'animejanai_hdr_mac' run.log
          ! grep -E 'Lua error|stack traceback' run.log
          ls -R "$HOME/Library/Application Support/AnimeJaNai" | head -30
          test -f "$HOME/Library/Application Support/AnimeJaNai/animejanai/animejanai.conf"
          # The display defaults were decided once (no XDR display on the runner: nothing changed).
          cat "$HOME/Library/Application Support/AnimeJaNai/.display-defaults"
          grep -q '^linux_hdr_output=' "$HOME/Library/Application Support/AnimeJaNai/portable_config/script-opts/animejanai_hdr_auto.conf"
          # The lighter profiles of the automatic choice exist in the application's bank.
          grep -q '^\[slot_6\]' "mac-out/mpv AnimeJaNai.app/Contents/Resources/animejanai/animejanai.conf"
          grep -q 'Backend: ONNX Runtime/CoreML' "$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
          grep -q 'Output: 1280x720' "$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
      - name: What the application holds and what its launcher prepares
        run: |
          RES="$APP/Contents/Resources"; DATA="$HOME/Library/Application Support/AnimeJaNai"
          # Signatures: the application as a whole, then each program that is run from Resources.
          codesign --verify --deep --strict "$APP"
          for code in "$RES/AnimeJaNaiUpdater" "$RES/animejanai/inference/animejanai-ort-test" \
              "$RES/animejanai/inference/libaji_ort.dylib" "$RES/animejanai/inference/libonnxruntime.1.dylib" "$RES/AnimeJaNai Manager.app"; do
            codesign --verify "$code" || { echo "::error title=not signed::$code"; exit 1; }
          done
          cat "$RES/manifest.json"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["platform"]=="osx-arm64" and m["version"]==sys.argv[2] and m["player_launcher"]=="mpv-animejanai", m' "$RES/manifest.json" "$VER"
          test "$(cat "$RES/version.txt")" = "$VER"
          # The first launch above left: links to every model file, the benchmark, the scripts.
          ls -la "$DATA/animejanai" "$DATA/animejanai/onnx" | cut -c1-200 | head -40
          for kind in onnx coreml.onnx ajm ajw mlpatch mlpackage; do
            ls "$DATA/animejanai/onnx"/*Sharp1_Performance*."$kind" >/dev/null || { echo "::error title=model link missing::$kind"; exit 1; }
          done
          test -L "$DATA/animejanai/benchmarks" && test -x "$DATA/animejanai/benchmarks/animejanai_benchmark_all.sh"
          for model in rife_v4.26 rife_v4.25 rife_v4.22_lite; do test -L "$DATA/animejanai/rife/$model.onnx"; done
          for script in animejanai_mac.lua animejanai_hdr_mac.lua animejanai_update.lua; do test -f "$DATA/portable_config/scripts/$script"; done
          grep -q 'animejanai_update' run.log
          # The player was given a socket of its own for the Manager.
          grep -Eq 'input-ipc-server|animejanai-mpv-' run.log
      - name: The two native engines through the player
        # The same synthetic clip with the bank set as the Manager writes it. On this virtual
        # machine Core ML computes on the CPU and Metal on the host's GPU: what is proven is the
        # whole path, bank -> script -> filter -> engine, for each choice.
        run: |
          conf="$HOME/Library/Application Support/AnimeJaNai/animejanai/animejanai.conf"
          log="$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
          cp "$conf" conf.saved
          status=0
          for choice in "CoreMLNative GPU Core.ML/GPU" "CoreMLNative NPU Core.ML/NPU" "CoreMLNative AUTO Core.ML/AUTO" \
              "CoreMLNative CPU Core.ML/CPU" "Metal GPU Metal/GPU" "Metal GPU+NPU Metal/GPU...Core.ML/NPU" "CoreMLNative GPU+NPU Core.ML/GPU...Core.ML/NPU"; do
            set -- $choice
            sed -i '' -e "s/^backend=.*/backend=$1/" -e "s/^apple_device=.*/apple_device=$2/" "$conf"
            rm -f "$log"
            perl -e 'alarm 240; exec @ARGV' "$APP/Contents/MacOS/mpv-animejanai" av://lavfi:testsrc2=size=640x360:rate=24 \
              --vo=null --ao=null --frames=8 --keep-open=no --log-file="run-engine.log" > console.log 2>&1 || echo "mpv exit code $?" >> console.log
            { grep -E '^Backend|^Output|^Tiles|^Devices|^Placement|^Frames|^Recent' "$log" 2>/dev/null; grep -E 'exit code' console.log; } | cut -c1-300 > short.txt
            if grep -Eq "^Backend: $3\$" "$log" 2>/dev/null && grep -q 'Output: 1280x720' "$log" && ! grep -q 'exit code' console.log; then
              note "player: $1 on $2" short.txt
            else
              grep -iE 'aji|animejanai|error|fail' run-engine.log | tail -14 | cut -c1-300 >> short.txt
              note "player: $1 on $2 FAILED" short.txt error; status=1
            fi
          done
          cp conf.saved "$conf"
          exit $status
      - name: RIFE through the player
        # Informative, never a failure: the first profile with interpolation x2 written as the
        # Manager writes it, played through the real filter. Frames out against frames in, and
        # what the engine reports.
        run: |
          conf="$HOME/Library/Application Support/AnimeJaNai/animejanai/animejanai.conf"
          log="$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
          cp "$conf" conf.saved
          python3 - "$conf" <<'EOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          keys = ('=yes\nchain_\\1_rife_factor_numerator=2\nchain_\\1_rife_factor_denominator=1\nchain_\\1_rife_model=426'
                  '\nchain_\\1_rife_ensemble=no\nchain_\\1_rife_scene_detect_threshold=0.150\nchain_\\1_rife_before_upscale=yes')
          open(path, 'w', encoding='utf-8').write(re.sub(r'(?m)^chain_(\d+)_rife=no$', r'chain_\1_rife' + keys, text))
          EOF
          rm -f "$log"
          perl -e 'alarm 240; exec @ARGV' "$APP/Contents/MacOS/mpv-animejanai" av://lavfi:testsrc2=size=640x360:rate=24 \
            --vo=null --ao=null --frames=24 --keep-open=no --log-file=run-rife.log > console.log 2>&1 || echo "mpv exit code $?" >> console.log
          { grep -E '^Backend|^RIFE|^Output|^Frames|^Recent' "$log" 2>/dev/null; grep -E 'exit code' console.log
            grep -E 'NCNN/Vulkan .* RIFE|animejanai.*(error|fail)' run-rife.log | sed 's/^\[[^]]*\]//' | cut -c1-200 | head -6; } | cut -c1-300 > short.txt
          if grep -q '^RIFE: rife_v4.26' "$log" 2>/dev/null; then note "rife through the player" short.txt
          else note "rife through the player: NOT RUNNING" short.txt warning; fi
          cp conf.saved "$conf"
          exit 0
      - name: Run Benchmarks from the application
        # What the Manager's button starts, in its short form: every engine once.
        run: |
          DATA="$HOME/Library/Application Support/AnimeJaNai"
          sh "$DATA/animejanai/benchmarks/animejanai_benchmark_all.sh" essai > bench-app.log 2>&1 || echo "exit code $?" >> bench-app.log
          tail -14 bench-app.log | cut -c1-300 > short.txt
          if grep -q '^RESULT' "$DATA/animejanai/benchmark-mac.txt" && ! grep -v '^RIFE' bench-app.log | grep -q 'failed\|exit code'; then note "benchmark from the application" short.txt
          else note "benchmark from the application FAILED" short.txt error; exit 1; fi
          test "$(grep -c '^RESULT' "$DATA/animejanai/benchmark-mac.txt")" -ge 5
      - name: Updater
        # --check on the assembled application, then a real update: a copy that believes it is an
        # old version downloads the application of the latest release, verifies it and takes its
        # place. Also the two cases where the application cannot be replaced where it is.
        env:
          ANIMEJANAI_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$APP/Contents/Resources/AnimeJaNaiUpdater" --check > updater-check.log 2>&1 || echo "exit code $?" >> updater-check.log
          cat updater-check.log
          if ! grep -Eq '^(UP_TO_DATE|UPDATE_AVAILABLE) ' updater-check.log; then note "updater --check FAILED" updater-check.log error; exit 1; fi
          # What the latest release offers for macOS (a release gets it some time after its creation).
          set -- $(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets \
            --jq '.tagName + " " + ([.assets[].name | select(endswith("-macos-arm64.zip"))] | length | tostring)')
          tag="$1"; offered="$2"
          old="$RUNNER_TEMP/old copy/mpv AnimeJaNai.app"
          mkdir -p "$RUNNER_TEMP/old copy" && cp -R "$APP" "$old"
          echo 0.0.1 > "$old/Contents/Resources/version.txt"
          "$old/Contents/Resources/AnimeJaNaiUpdater" --check > old-check.log 2>&1 || echo "exit code $?" >> old-check.log
          cat old-check.log
          if [ "$offered" = 0 ]; then
            grep -q '^UP_TO_DATE 0.0.1' old-check.log
            echo "::warning title=updater::release $tag has no macOS application yet: the replacement was not exercised"
            exit 0
          fi
          grep -q "^UPDATE_AVAILABLE $tag" old-check.log && ! grep -q 'UPDATE_BLOCKED' old-check.log
          # Not replaceable where it is: a folder without write access, a translocated copy.
          mkdir -p "$RUNNER_TEMP/locked" "$RUNNER_TEMP/AppTranslocation/0000/d"
          cp -R "$old" "$RUNNER_TEMP/locked/" && cp -R "$old" "$RUNNER_TEMP/AppTranslocation/0000/d/"
          chmod a-w "$RUNNER_TEMP/locked"
          "$RUNNER_TEMP/locked/mpv AnimeJaNai.app/Contents/Resources/AnimeJaNaiUpdater" --check | tee locked.log
          "$RUNNER_TEMP/locked/mpv AnimeJaNai.app/Contents/Resources/AnimeJaNaiUpdater" --apply --no-relaunch | tee locked-apply.log || true
          chmod u+w "$RUNNER_TEMP/locked"
          "$RUNNER_TEMP/AppTranslocation/0000/d/mpv AnimeJaNai.app/Contents/Resources/AnimeJaNaiUpdater" --check | tee moved.log
          grep -q '^UPDATE_BLOCKED readonly' locked.log && grep -q '^FAILED The folder' locked-apply.log
          test "$(cat "$RUNNER_TEMP/locked/mpv AnimeJaNai.app/Contents/Resources/version.txt")" = 0.0.1
          grep -q '^UPDATE_BLOCKED translocated' moved.log
          # The replacement, with a process standing for the player: the application is ready
          # before that process ends, and takes its place after.
          sleep 25 & player=$!
          "$old/Contents/Resources/AnimeJaNaiUpdater" --apply --wait-pid "$player" --status "$RUNNER_TEMP/update.status" --no-relaunch > apply.log 2>&1 || echo "exit code $?" >> apply.log
          grep -vE '^DOWNLOAD ([0-9]|[1-8][0-9]|9[0-8])$' apply.log | cut -c1-300 > short.txt
          ls -la "$RUNNER_TEMP/old copy" >> short.txt
          if grep -q "^READY $tag" apply.log && grep -q "^DONE $tag" apply.log \
              && [ "$(cat "$old/Contents/Resources/animejanai/version.txt")" = "$tag" ] && codesign --verify --deep "$old" \
              && [ "$(ls -A "$RUNNER_TEMP/old copy" | wc -l | tr -d ' ')" = 1 ] && [ "$(cat "$RUNNER_TEMP/update.status")" = "DONE $tag" ]; then
            note "updater: 0.0.1 replaced by $tag" short.txt
          else
            note "updater replacement FAILED" short.txt error; exit 1
          fi
          # The replaced application is the released one, complete: it plays.
          rm -f "$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
          perl -e 'alarm 120; exec @ARGV' "$old/Contents/MacOS/mpv-animejanai" av://lavfi:testsrc2=size=640x360:rate=24 \
            --vo=null --ao=null --frames=6 --keep-open=no > console.log 2>&1 || echo "mpv exit code $?"
          grep -q 'Output: 1280x720' "$HOME/Library/Caches/AnimeJaNai/currentanimejanai.log"
      - name: Archive
        run: |
          cp installer/macos/LISEZ-MOI.txt mac-out/
          ( cd mac-out && ditto -c -k --keepParent "mpv AnimeJaNai.app" "../mpv-AnimeJaNai-HDR-v$VER-macos-arm64.zip" )
          # Read by the updater before it unpacks a download.
          shasum -a 256 "mpv-AnimeJaNai-HDR-v$VER-macos-arm64.zip" > "mpv-AnimeJaNai-HDR-v$VER-macos-arm64.zip.sha256"
          ls -la *.zip *.sha256
          # The archive is what users and the updater get: unpacked, it is one valid application.
          mkdir unpacked && ditto -x -k "mpv-AnimeJaNai-HDR-v$VER-macos-arm64.zip" unpacked
          test "$(ls unpacked)" = "mpv AnimeJaNai.app" && codesign --verify --deep --strict "unpacked/mpv AnimeJaNai.app"
          rm -rf unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: mac-player
          path: |
            mpv-AnimeJaNai-HDR-v*-macos-arm64.zip
            mpv-AnimeJaNai-HDR-v*-macos-arm64.zip.sha256
            installer/macos/LISEZ-MOI.txt
            run.log
          if-no-files-found: error
      - name: Add the macOS files to the release
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish independently: Deploy may fail before creating the release.
          # Do not promote a macOS-only release over the latest Windows release.
          if ! gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating release $VER for the validated macOS build"
            gh release create "$VER" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$VER" --latest=false \
              --notes "mpv-AnimeJaNai HDR $VER. Assets are published as platform builds succeed." \
              || gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null
            # If Deploy created it concurrently, reuse that release; otherwise fail.
          fi
          cp installer/macos/LISEZ-MOI.txt "LISEZ-MOI-macOS.txt"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n mac-bench -D bench
          # The application last: installed copies take a release as an update once it is there,
          # and its checksum must already be.
          gh release upload "$VER" --repo "$GITHUB_REPOSITORY" --clobber \
            "mpv-AnimeJaNai-HDR-v$VER-macos-arm64.zip.sha256" "LISEZ-MOI-macOS.txt" bench/AnimeJaNai-mac-bench.zip
          gh release upload "$VER" --repo "$GITHUB_REPOSITORY" --clobber "mpv-AnimeJaNai-HDR-v$VER-macos-arm64.zip"
