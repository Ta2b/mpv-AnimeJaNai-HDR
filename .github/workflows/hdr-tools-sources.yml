name: HDR tools sources

# Decompiles the .NET helpers shipped in hdr-tools/ (hdr-coordinator.exe,
# hdr-composition-guard.exe) with ILSpy and commits the C# projects to hdr-tools-src/, so what
# the package runs can be read and rebuilt. display-info.dll is native: its source is the
# mpv-display-plugin project (see hdr-tools-src/README.md).
on:
  push:
    branches: [hdr-3.8, hdr]
    paths:
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/hdr-tools/*.exe'
      - '.github/workflows/hdr-tools-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Decompile
      run: |
        set -euo pipefail
        export DOTNET_ROLL_FORWARD=Major
        dotnet tool install -g ilspycmd
        export PATH="$PATH:$HOME/.dotnet/tools"
        tools=BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/portable_config/hdr-tools
        for exe in hdr-coordinator hdr-composition-guard; do
          rm -rf "hdr-tools-src/$exe"
          mkdir -p "hdr-tools-src/$exe"
          ilspycmd -p -o "hdr-tools-src/$exe" "$tools/$exe.exe"
          # Framework references resolved on the runner: keep them as plain references.
          sed -i '/<HintPath>.*\/dotnet\/shared\//d' "hdr-tools-src/$exe/$exe.csproj"
          sha256sum "$tools/$exe.exe" | cut -d' ' -f1 > "hdr-tools-src/$exe/SOURCE-SHA256.txt"
        done

    - name: Build the decompiled projects (sanity check)
      continue-on-error: true
      run: |
        for p in hdr-tools-src/*/*.csproj; do dotnet build "$p" -c Release -nologo -v q || echo "::warning::$p does not rebuild as is"; done
        find hdr-tools-src -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +

    - name: Commit
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add hdr-tools-src
        if git diff --cached --quiet; then echo 'Sources up to date'; exit 0; fi
        git commit -m 'Decompiled sources of the HDR helpers'
        git push
